      "id": "C2",
      "text": "核对实际工具与来源记录及最终建议。未调查已有能力就直接设计新的 CSS 系统、插件、Graph Engine 或工作流，只搜索预先想到的候选，访问失败便声称没有现成方案，或成熟组合已覆盖主要需求仍建议整套自建，任一项即失败；通过时至少有一项用户未点名的已有能力实际改变候选或推荐。",
