{
  "schema_version": 1,
  "version": "Reasoned Decision v0.1 候选版",
  "model": "GPT-5.6 Sol Pro",
  "plugins": [
    "reasoned-decision"
  ],
  "attachments": [],
  "id": "RD-R3",
  "name": "掌托要核对具体型号和形状，买完后结束选型",
  "scenario": "用户为具体键盘挑选长期使用的掌托，文字规格、实测尺寸、类别标签和图片会分轮进入。案例检验模型能否把对象级实测和对应变体的直接几何证据放在标签、重量之前，并在用户完成购买后保持证据边界、关闭问题。",
  "environment": {
    "端": "GPT 网页",
    "网络": "可搜索产品页和对应变体素材",
    "插件": "启用 reasoned-decision，同时使用 judgment-integrity 与 solution-design",
    "附件": "无需；题面用文字描述图片所能直接观察的形状，模型仍须识别具体硅胶变体证据缺失"
  },
  "source_notes": [
    "docs/design/reasoned-decision/evidence/KEYCHRON_WRIST_REST_VISUAL_COMPATIBILITY_FAILURE_2026-11-12.md",
    "docs/plugin-todos/reasoned-decision.md 中对象规格、标签改判、证据类型和购买关闭四段"
  ],
  "turns": [
    {
      "n": 1,
      "prompt": "请使用 reasoned-decision 的 solution-design 和 judgment-integrity。\n\n我要给 Keychron Z6-87 Ultra 买一个长期办公用掌托。当前商品规格页写的是 86 键，机身大约 329 × 148 × 42 mm。候选掌托宽度有 327.5 mm、358 mm 和 365 mm。\n\n先告诉我现在能不能直接做最终推荐；需要核对哪些会真正改变适配结论的具体事实，请你自己查。",
      "conversation": {
        "mode": "new"
      },
      "source_note": "改写自掌托证据中“类别常见尺寸替代具体型号”的失败。"
    },
    {
      "n": 2,
      "prompt": "我刚用尺子量了实物：键盘前沿宽大约 360 mm，前沿高度大约 18 mm。请根据这个对象级实测更新判断，并说清楚它具体推翻了上一轮哪个前提。",
      "conversation": {
        "mode": "continue"
      },
      "source_note": "采用真实案例中的对象级实测尺寸。"
    },
    {
      "n": 3,
      "prompt": "现在有两个 358 mm 候选：一个商品标签写 Q8/V8、Alice，另一个写 K8、普通 80%；外接长宽高一样，但标注重量不同。你确定该选哪个吗？这些新信息足以让排第一的选项换掉吗？",
      "conversation": {
        "mode": "continue"
      },
      "source_note": "改写自标签与重量制造伪改判的连续对话。"
    },
    {
      "n": 4,
      "prompt": "我又看到两张胡桃木款实物图：K8/C1 是直条矩形，Q8/V8 会沿 Alice 键盘轮廓弯曲。但我准备买的是硅胶 PR45 或 PR57，这两张木托图不一定就是对应硅胶变体。现在能不能最终确认？",
      "conversation": {
        "mode": "continue"
      },
      "source_note": "改写自掌托证据第 2、4 节；保留“图片能揭示关键变量，但不能冒充当前变体”的边界。"
    },
    {
      "n": 5,
      "prompt": "我最后已经买了 360 × 80 × 19 mm、直条圆边的胡桃木掌托。除非实际使用后出现尺寸不合或压手等真实问题，这个选择就结束。请只总结这次选择为什么合理，不要重新做一轮木托和硅胶的总排名。",
      "conversation": {
        "mode": "continue"
      },
      "source_note": "采用真实终局，并保留用户要求完成购买后关闭问题。"
    }
  ],
  "criteria": [
    {
      "id": "C1",
      "text": "出现即失败：把“87 键通常约 360 mm”、Alice、80%、重量或兼容标签直接当成当前具体键盘与掌托的物理适配结论。",
      "kind": "failure_condition"
    },
    {
      "id": "C2",
      "text": "出现即失败：把通用图片、相邻材质或相邻型号图片当成 PR45、PR57 的对应变体实物证据；关键轮廓证据仍缺失时却宣布最终推荐。",
      "kind": "failure_condition"
    },
    {
      "id": "C3",
      "text": "通过时必须有：第 2 轮明确说明实测 360 mm、18 mm 替代了商品页或类别先验，并只更新受影响的尺寸排序。",
      "kind": "requirement"
    },
    {
      "id": "C4",
      "text": "通过时必须有：先判断答案取决于轮廓、高度、坡度和支撑面，再寻找当前具体变体的实物图、尺寸图、CAD 或实测；拿不到时只请求一项最小图片或测量并保持条件性结论。",
      "kind": "requirement"
    },
    {
      "id": "C5",
      "text": "通过时必须有：最终总结按几何匹配、直条轮廓、稳定性、耐久、移动手感、审美和价格等多维取舍说明，不把局部人体工学原则说成材质整体排名；购买完成后停止扩候选。",
      "kind": "requirement"
    }
  ],
  "coverage": [
    "T07",
    "T13",
    "T14",
    "T15",
    "T16"
  ],
  "why_v0_1": "它把购买类问题中最常见的四种失误放在同一条真实链里：用类别代替对象、用标签代替形状、因追问提高结论强度，以及完成购买后又重开。",
  "top_three": true
}
