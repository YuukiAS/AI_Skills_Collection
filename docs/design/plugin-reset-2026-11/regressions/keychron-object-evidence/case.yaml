期望行为: "先绑定当前键盘、掌托具体 SKU 与销售变体，识别轮廓、高度、坡度、支撑面和材料等决定变量；几何判断优先使用对应变体的实物图、CAD、尺寸图或实测，类别标签、重量和通用尺寸只作旁证；缺少直接视觉或测量证据时先用工具取得，仍取不到则请求最小图片或测量并保持条件性结论；最终选择按多维取舍说明，用户完成购买后关闭问题。"
判定方式: "由模型或人检查对象来源、证据链和最终回答。因 Alice 标签或相同外接尺寸直接判定兼容性，把通用或相邻产品图片当成当前变体，关键几何证据缺失仍宣布最终推荐，把局部材质原则升级成材质总排名，或购买完成后无相关失败仍重新选型，任一项即失败；通过时决定变量、证据形式和具体对象一一对应。"
