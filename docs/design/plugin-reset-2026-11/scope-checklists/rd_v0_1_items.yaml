title: Reasoned Decision 要做哪些
subtitle: 每行在“0.1 / 0.2 / 搁置”里勾一个。每条附上现在的规则原文、为什么算硬或软，以及我建议的写法。
status_legend:
  写硬了: 规则里明确要求，模型读完知道该怎么做
  写软了: 提到了，但只是“可以”“按需”，或只覆盖一部分
  没写: 规则里找不到
sections:
- heading: 现成办法没查全
  items:
  - id: 1
    need: 产品、工具、配置、故障、购买类问题，默认先搜论坛和 GitHub Issues，不等我提醒。中文查 V2EX、NGA、LINUX DO，英文查 Reddit、Stack Exchange、厂商论坛。纯学术问题照常查论文。
    case: 微信关了自动更新还在下载。V2EX、LINUX DO 上早有大量相同报告，GitHub 上也有长期维护的阻止更新工具，模型却只查了官方文档和代码。Edge 自动更新那次也一样，直到我问“Reasoned Decision 没写查论坛？”它才去查 Reddit 和微软社区。
    status: 写软了
    rule_id: SD-02
    rule_quote: 按需检查当前上下文与项目、用户已有仓库和已安装能力、产品原生与官方生态、成熟实现、代表性成品、高价值社区经验及长期失败路线。
    why: “按需”把查不查交给模型自己决定，它通常觉得官方文档就够了。论坛只是一长串来源里的一项，也没说具体去哪里查。
    proposal: 遇到产品、工具、配置、故障或购买问题，给方案前必须先搜论坛和 GitHub Issues：中文查 V2EX、LINUX DO、NGA 里相关的版块，英文查 Reddit、Stack Exchange 或厂商论坛。回答里写明查了哪些、找到了什么，没找到也要说。纯学术问题不受这条限制。
  - id: 2
    need: 成熟产品先查它自带的设置能不能解决，再考虑写脚本。
    case: iTerm2 在 SSH 断开后乱发鼠标字符，模型直接推荐在 zsh 里加一段脚本。其实 iTerm2 自带“只在全屏程序里发送鼠标事件”的选项，正好解决。
    status: 写硬了
    rule_id: SD-05
    rule_quote: 依次考虑直接采用、组合、局部扩展和最小自建。提出自建时须列出实际检查的现成路线、它们已覆盖的部分、仍未满足的硬约束……
    why: 先后顺序写死了，而且想自己做就必须先列出查过哪些现成办法。模型跳过这一步就是明显违规。
    proposal: 保持不变。可以补半句：“现成办法包括这个产品自带的设置。”
  - id: 3
    need: 要读取某个程序的状态时，先找它自己的数据：配置文件、日志、命令行、只读接口。界面自动化和申请新权限放最后。
    case: 要知道 UU 远控当前是哪台设备在控制，模型准备弹出 UU 主窗口并申请辅助功能权限。我提醒“最好用代码看”后，它才找到 UU 自己的只读接口，最后不用界面、不加权限就做成了。
    status: 写软了
    rule_id: SD-06
    rule_quote: 诊断故障时先定位真实状态持有者，优先读取文件、数据库、日志、命令接口、IPC 或只读 API……
    why: 这句只挂在“诊断故障”下面。UU 那次是要读当前状态，不是排查故障，模型不会想到套用这条。也没说弹窗口、申请新权限本身就是代价。
    proposal: 需要知道某个程序的当前状态时（不管是不是在排查故障），先找它自己的数据：配置文件、日志、命令行、它自己在用的只读接口。这些都拿不到时，才用界面自动化或申请新权限，并先说明为什么前面的办法不行。
- heading: 没找对位置就大修
  items:
  - id: 4
    need: 卸载、重装、重置之前，先查清问题具体存在哪里，找最小、能撤回的修法。
    case: 两台 Mac 共用了 Tailscale 身份，模型直接把官方“完整卸载重装”写进执行指令，系统权限弹窗都出来了。我追问“真的要卸载吗”，它才找到只重置这台机器身份、不用卸载的办法。
    status: 写硬了
    rule_id: SD-06
    rule_quote: ……重启、升级、重置和重装须有较小动作不足的依据。
    why: 明确要求：想卸载、重置，必须先拿出“小办法不够”的理由。模型不能直接跳到大动作。
    proposal: 保持不变。可以补一句：“官方文档里的完整卸载重装是最后手段，不等于最小修法。”
  - id: 5
    need: 系统升级、整机重启这类打断大的动作排在最后。故障正在发生时，先利用现场做最小的对比测试。
    case: Edge 和飞书把中文画成别的字，模型先推荐升级系统、整机重启。别人遇到同样问题时，重启字体服务、重开应用就好了。
    status: 写硬了
    rule_id: SD-06
    rule_quote: ……并尽量保留正在发生的现场。选择能区分主要解释的最小观测；重启、升级、重置和重装须有较小动作不足的依据。
    why: 要求先利用现场做最小的测试，再加上大动作必须给理由，两条一起把升级、重启压到了后面。
    proposal: 意思保持不变，把“最小观测”换成大白话：“故障还在发生时，先做一个能分清几种可能原因的小测试，再动系统。”
- heading: 整体目标被眼前的症状带走
  items:
  - id: 6
    need: 先确认我要的整体效果，先回答“能不能做到、能做到多接近、还差什么验证”。不要每出一个新症状就换一整套方案。
    case: 我要用 Legion 远控 Mac mini 时，键盘手感和直接用本机一样。模型先只修 Ctrl+Enter，再建议全局改键，又换成另一个后备方案，每轮只抓一个症状，我只能不停补充要求。
    status: 写软了
    rule_id: SD-01 / TS-06
    rule_quote: 先确认用户要达到的结果、当前环境已经具备的能力……　连续两次同类方案被推翻后，停止扩候选，优先裁决一个信息价值最高的未知。
    why: 有“先确认目标”，但没要求在给方案前先告诉我能不能做到、能做到多接近。模型确认完目标，照样一个症状换一个方案；要等推翻两次才收手。
    proposal: 不是小事的问题，第一次给方案前先用两三句话回答：我要的整体效果能不能做到、能做到多接近、还差什么要验证。之后出现新症状，先说它影响整体目标的哪一部分，只改那一部分。
  - id: 7
    need: 涉及多台设备或多个入口时，先列一张“从哪里操作 → 应该怎样表现”的表，再定方案。
    case: 我会从 Legion、ThinkPad、MacBook、通用控制和本机键盘操作同一台 Mac mini。模型先做成一个全局开关，我把入口一个个补上后，它才改成按控制端自动切换。
    status: 写硬了
    rule_id: TS-04
    rule_quote: 多设备、多角色或多入口任务先形成最小“场景 → 期望行为”对应关系。
    why: 要求和触发条件都写清了。但这条放在附属文件里，模型要先打开那个文件才看得到。
    proposal: 内容不变，挪进技能正文，让模型一定能看到。
  - id: 8
    need: 现在有的功能不一定要保留。去掉不需要的东西能让问题变小时，先做减法。
    case: 为了挡住 Edge 自动更新，模型默认要保留 Copilot 和它的自动更新，方案越堆越复杂。我问“Copilot 直接卸了不行？”，问题一下子小了很多。
    status: 写软了
    rule_id: SD-04
    rule_quote: 保留现状和移除非必要需求都可以进入候选比较。
    why: “可以进入比较”只是允许，不是要求。模型不会主动问“这个东西能不能不要”。
    proposal: 方案开始变复杂时，先检查有没有哪个现有组件或要求其实可以不要。如果去掉它能让问题明显变小，把“去掉它”作为第一个候选告诉我。
- heading: 查的不是能定答案的东西
  items:
  - id: 9
    need: 推荐前先查清具体型号的真实规格，不用类别名代替。
    case: 选掌托时，模型按“87 键大约 360mm”排序，还说是“最终推荐”。我找来商品页，实际只有 329mm，排序全变。
    status: 写硬了
    rule_id: JI-01
    rule_quote: 先确认具体对象、型号或变体、环境、时点及成功标准。缺失事实优先用当前网页、连接器和其他可用工具取得……
    why: 要求先确认具体型号；另一条规则（JI-04）要求关键信息没查到时只能给有条件的推荐，不能说“最终”。
    proposal: 保持不变。
  - id: 10
    need: 先想清楚什么证据能直接看出答案：形状问题看图，行为问题看实测。不要拿标签、重量这些间接信息反复比较。
    case: 掌托能不能贴合键盘前沿是形状问题，模型却一直在比长度、高度、型号标签和重量。我发了两张图，一眼就看出问题。
    status: 写硬了
    rule_id: JI-02
    rule_quote: 先列出真正决定成功的属性，再选择能直接观察这些属性的证据形式。类别标签、重量、名称、兼容列表和通用素材只能在其相关性得到说明后参与判断。
    why: 方向是对的，但“决定成功的属性”“证据形式”太抽象，模型读完不一定会想到“这里该去找图”。
    proposal: 先想清楚答案取决于什么：取决于形状，就找实物图、尺寸图或实拍；取决于行为，就找实测或现场结果。标签、型号名、重量只能当线索，不能拿来下结论。
- heading: 新信息一来就改口
  items:
  - id: 11
    need: 已经被现场证据排除的路线，不因为出了新事故又提出来；除非新证据说明当初排除的理由不成立。
    case: Edge 自动更新复发时，模型第一反应又提出上一轮已被现场证据排除的组策略路线，后来才撤回。
    status: 写硬了
    rule_id: JI-06
    rule_quote: 已淘汰路线只有在新证据解除原淘汰原因后才重新进入比较。
    why: 条件写得很具体：必须是新证据，而且要正好推翻当初排除的理由。
    proposal: 保持不变。
  - id: 12
    need: 新信息不影响结论就不改口。连续改口两次后停下来，只找一个能定胜负的测试。
    case: 实测尺寸已经够做决定，模型却因为一个“Alice 配列”标签把推荐从 358mm 改成 365mm，又改回去，再改，再拿“重量不同”当理由，前后改了四次。
    status: 写硬了
    rule_id: JI-05 / JI-07
    rule_quote: 改变正式推荐前，写清上一轮推荐、关键前提、新增或纠正的事实、受影响的变量与候选，以及排序怎样变化。新信息没有实质影响时延续原推荐……　同类方案连续两次被推翻后，停止扩大候选和整套重排……
    why: 改口必须写出依据，新信息没影响就维持原推荐，连续推翻两次就停。三点都是明确要求。
    proposal: 保持不变。可以把“实质影响”说成大白话：“判断标准是这条新信息会不会让排第一的选项换掉。”
- heading: 做完的事又重新开始
  items:
  - id: 13
    need: 同一台机器上成功过的做法直接沿用；“完成”按我真正要看到的界面算。
    case: 之前已经成功打开过 Asteria Atlas，看新版本时模型重新检查安装和环境，扩到各种自动化权限；最后停在开始页，就当成“已打开”。
    status: 写硬了
    rule_id: TS-03 / TS-08
    rule_quote: 同一环境已经验证成功的能力继续沿用；新会话、版本号变化或用户追问本身不触发整套重新发现。　SUCCESS_CRITERION 成立后记录完成并停止展开。
    why: 要求写清了，完成标准也定义为“用户实际看到什么”。但同样放在附属文件里。
    proposal: 内容不变，挪进正文，并补半句：“程序启动了、停在开始页或中间页，都不算完成。”
  - id: 14
    need: 做完的步骤不再重做。某一步出问题时，只解决这一步，不加新工具，不重走整条路。
    case: Project 设置已经粘贴保存好，只剩回读一下。模型却反复重新找 Project、开设置、粘贴；一处界面不顺，就扩到 DevTools、脚本和临时网页。我说了好几次“别折腾，只收尾”都没用。
    status: 写软了
    rule_id: TS-03
    rule_quote: 下一步必须跳过 COMPLETED_ACTIONS，遵守 CLOSED_QUESTIONS、ELIMINATED_ROUTES 和 DO_NOT_REVIVE。
    why: 写了跳过已完成的步骤，但没写某一步出问题以后怎么办。Project 那次正是一处界面不顺，就扩出一堆新工具，还把做好的步骤推倒重来。
    proposal: 某一步出问题时，保留已经做好的部分，只处理卡住的这一步，先用最直接的办法再试一次；不引入新工具，不重走前面的步骤。我说“别折腾”时，只做剩下的那一个动作。
- heading: 最后确认时说过头
  items:
  - id: 15
    need: 最终确认不能比之前的证据说得更满。证据只支持某条原则时，不升级成“哪个整体更好”。
    case: 证据只说明“掌托要避免硬边、要匹配高度”，我要求最终确认时，模型说成了“硅胶整体优于木托”。
    status: 写硬了
    rule_id: JI-09
    rule_quote: 最终确认保持原证据范围，局部优势不能自动升级成类别总排名。
    why: 明确禁止把局部结论放大成总排名。
    proposal: 意思保持不变，把“类别总排名”说成大白话：“不把只支持某一点的证据说成‘哪种整体更好’。”
regressions:
  heading: 用哪些案例测试
  note: 每条是一次真实对话重放，看模型这次有没有做对。
  items:
  - id: R1
    name: Edge 自动更新改判
    tests: 被追问但没有新信息时不改口；新证据只改受影响的部分；被排除的路线不复活。（对应第 11、12 条）
    origin: 已有
  - id: R2
    name: Obsidian 图谱变好看
    tests: 先查 Obsidian 自带功能、插件、主题和社区成品，再考虑自己做。（对应第 2 条）
    origin: 已有
  - id: R3
    name: 键盘掌托选购
    tests: 查具体型号、看图判断形状、最终确认不说过头、买完就结束。（对应第 9、10、15 条）
    origin: 已有
  - id: R4
    name: 微信自动更新
    tests: 不提醒的情况下，是否主动去 V2EX、LINUX DO、GitHub Issues 找相同报告和现成工具。（对应第 1 条）
    origin: 新增
  - id: R5
    name: Tailscale 身份 / 中文错字
    tests: 卸载、重启、升级之前，先找到问题所在和最小修法。（对应第 4、5 条）
    origin: 新增
  - id: R6
    name: UU 远控键盘
    tests: 守住整体体验，列出各入口该怎样表现，不因新症状换整套方案。（对应第 6、7 条）
    origin: 新增
  - id: R7
    name: Asteria 打开 / Project 设置收尾
    tests: 成功过的做法直接沿用，做完的步骤不重做，到了真正终点就停。（对应第 13、14 条）
    origin: 新增
