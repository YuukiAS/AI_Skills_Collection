# Reasoned Decision v0.1 范围勾选表 —— 内容源（Claude 撰写，渲染时逐字使用，不得改字）
title: Reasoned Decision 要做哪些
subtitle: 每行在“0.1 / 0.2 / 搁置”里勾一个。状态说明现在的规则写到了什么程度。
status_legend:
  写硬了: 规则里明确要求，模型读完知道该怎么做
  写软了: 提到了，但只是“可以”“按需”，或只覆盖一部分
  没写: 规则里找不到

sections:
  - heading: 现成办法没查全
    items:
      - id: 1
        need: 产品、工具、配置、故障、购买类问题，默认先搜论坛和 GitHub Issues，不等我提醒。中文查 V2EX、NGA、LINUX DO，英文查 Reddit、Stack Exchange、厂商论坛。纯学术问题照常查论文。
        case: 微信关了自动更新还在下载。V2EX、LINUX DO 上早有大量相同报告，GitHub 上也有长期维护的阻止更新工具，模型却只查了官方文档和代码。Edge 自动更新那次也一样，直到我问“Reasoned Decision 没写查论坛？”它才去查 Reddit 和微软社区。
        status: 写软了
        status_note: 只写了“按需检查……社区经验”，没说必须查，也没点名任何论坛。
      - id: 2
        need: 成熟产品先查它自带的设置能不能解决，再考虑写脚本。
        case: iTerm2 在 SSH 断开后乱发鼠标字符，模型直接推荐在 zsh 里加一段脚本。其实 iTerm2 自带“只在全屏程序里发送鼠标事件”的选项，正好解决。
        status: 写硬了
        status_note: 要求按“直接用现成的 → 组合 → 局部扩展 → 自己做”的顺序考虑。
      - id: 3
        need: 要读取某个程序的状态时，先找它自己的数据：配置文件、日志、命令行、只读接口。界面自动化和申请新权限放最后。
        case: 要知道 UU 远控当前是哪台设备在控制，模型准备弹出 UU 主窗口并申请辅助功能权限。我提醒“最好用代码看”后，它才找到 UU 自己的只读接口，最后不用界面、不加权限就做成了。
        status: 写软了
        status_note: 只在“诊断故障”时要求先读文件和接口；一般的状态读取没覆盖，也没说新权限本身是代价。

  - heading: 没找对位置就大修
    items:
      - id: 4
        need: 卸载、重装、重置之前，先查清问题具体存在哪里，找最小、能撤回的修法。
        case: 两台 Mac 共用了 Tailscale 身份，模型直接把官方“完整卸载重装”写进执行指令，系统权限弹窗都出来了。我追问“真的要卸载吗”，它才找到只重置这台机器身份、不用卸载的办法。
        status: 写硬了
        status_note: 要求先找问题所在，重启、升级、重置、重装要说明为什么小办法不够。
      - id: 5
        need: 系统升级、整机重启这类打断大的动作排在最后。故障正在发生时，先利用现场做最小的对比测试。
        case: Edge 和飞书把中文画成别的字，模型先推荐升级系统、整机重启。别人遇到同样问题时，重启字体服务、重开应用就好了。
        status: 写硬了
        status_note: 要求尽量保留正在发生的现场，先做最小观测。

  - heading: 整体目标被眼前的症状带走
    items:
      - id: 6
        need: 先确认我要的整体效果，先回答“能不能做到、能做到多接近、还差什么验证”。不要每出一个新症状就换一整套方案。
        case: 我要用 Legion 远控 Mac mini 时，键盘手感和直接用本机一样。模型先只修 Ctrl+Enter，再建议全局改键，又换成另一个后备方案，每轮只抓一个症状，我只能不停补充要求。
        status: 写软了
        status_note: 有“先确认目标”和“连续推翻两次就收缩”，但没要求先回答能不能做到、能多接近。
      - id: 7
        need: 涉及多台设备或多个入口时，先列一张“从哪里操作 → 应该怎样表现”的表，再定方案。
        case: 我会从 Legion、ThinkPad、MacBook、通用控制和本机键盘操作同一台 Mac mini。模型先做成一个全局开关，我把入口一个个补上后，它才改成按控制端自动切换。
        status: 写硬了
        status_note: 明确要求多入口任务先列“场景 → 期望行为”。
      - id: 8
        need: 现在有的功能不一定要保留。去掉不需要的东西能让问题变小时，先做减法。
        case: 为了挡住 Edge 自动更新，模型默认要保留 Copilot 和它的自动更新，方案越堆越复杂。我问“Copilot 直接卸了不行？”，问题一下子小了很多。
        status: 写软了
        status_note: 只说“去掉不必要的需求可以参与比较”，没要求主动问哪些可以不要。

  - heading: 查的不是能定答案的东西
    items:
      - id: 9
        need: 推荐前先查清具体型号的真实规格，不用类别名代替。
        case: 选掌托时，模型按“87 键大约 360mm”排序，还说是“最终推荐”。我找来商品页，实际只有 329mm，排序全变。
        status: 写硬了
        status_note: 要求先确认具体型号、变体和环境。
      - id: 10
        need: 先想清楚什么证据能直接看出答案：形状问题看图，行为问题看实测。不要拿标签、重量这些间接信息反复比较。
        case: 掌托能不能贴合键盘前沿是形状问题，模型却一直在比长度、高度、型号标签和重量。我发了两张图，一眼就看出问题。
        status: 写硬了
        status_note: 意思写到了，但用词抽象（“决定变量”“证据形式”），模型未必照做。

  - heading: 新信息一来就改口
    items:
      - id: 11
        need: 已经被现场证据排除的路线，不因为出了新事故又提出来；除非新证据说明当初排除的理由不成立。
        case: Edge 自动更新复发时，模型第一反应又提出上一轮已被现场证据排除的组策略路线，后来才撤回。
        status: 写硬了
        status_note: 明确要求被排除的路线只有在排除理由失效后才能回来。
      - id: 12
        need: 新信息不影响结论就不改口。连续改口两次后停下来，只找一个能定胜负的测试。
        case: 实测尺寸已经够做决定，模型却因为一个“Alice 配列”标签把推荐从 358mm 改成 365mm，又改回去，再改，再拿“重量不同”当理由，前后改了四次。
        status: 写硬了
        status_note: 明确要求改口前写清依据，连续推翻两次后收缩。

  - heading: 做完的事又重新开始
    items:
      - id: 13
        need: 同一台机器上成功过的做法直接沿用；“完成”按我真正要看到的界面算。
        case: 之前已经成功打开过 Asteria Atlas，看新版本时模型重新检查安装和环境，扩到各种自动化权限；最后停在开始页，就当成“已打开”。
        status: 写硬了
        status_note: 要求沿用已验证成功的做法，完成标准是用户实际看到的结果。
      - id: 14
        need: 做完的步骤不再重做。某一步出问题时，只解决这一步，不加新工具，不重走整条路。
        case: Project 设置已经粘贴保存好，只剩回读一下。模型却反复重新找 Project、开设置、粘贴；一处界面不顺，就扩到 DevTools、脚本和临时网页。我说了好几次“别折腾，只收尾”都没用。
        status: 写软了
        status_note: 写了跳过已完成的步骤，没写某一步出问题时只修这一步、不加新工具。

  - heading: 最后确认时说过头
    items:
      - id: 15
        need: 最终确认不能比之前的证据说得更满。证据只支持某条原则时，不升级成“哪个整体更好”。
        case: 证据只说明“掌托要避免硬边、要匹配高度”，我要求最终确认时，模型说成了“硅胶整体优于木托”。
        status: 写硬了
        status_note: 明确要求最终确认不超出原有证据范围。

regressions:
  heading: 用哪些案例测试
  note: 每条是一次真实对话重放，看模型这次有没有做对。
  items:
      - id: R1
        name: Edge 自动更新改判
        tests: 被追问但没有新信息时不改口；新证据只改受影响的部分；被排除的路线不复活。（对应第 11、12 条）
        origin: 已有
      - id: R2
        name: Obsidian 图谱变好看
        tests: 先查 Obsidian 自带功能、插件、主题和社区成品，再考虑自己做。（对应第 2 条）
        origin: 已有
      - id: R3
        name: 键盘掌托选购
        tests: 查具体型号、看图判断形状、最终确认不说过头、买完就结束。（对应第 9、10、15 条）
        origin: 已有
      - id: R4
        name: 微信自动更新
        tests: 不提醒的情况下，是否主动去 V2EX、LINUX DO、GitHub Issues 找相同报告和现成工具。（对应第 1 条）
        origin: 新增
      - id: R5
        name: Tailscale 身份 / 中文错字
        tests: 卸载、重启、升级之前，先找到问题所在和最小修法。（对应第 4、5 条）
        origin: 新增
      - id: R6
        name: UU 远控键盘
        tests: 守住整体体验，列出各入口该怎样表现，不因新症状换整套方案。（对应第 6、7 条）
        origin: 新增
      - id: R7
        name: Asteria 打开 / Project 设置收尾
        tests: 成功过的做法直接沿用，做完的步骤不重做，到了真正终点就停。（对应第 13、14 条）
        origin: 新增
