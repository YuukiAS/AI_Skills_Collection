  problem: 新事故触发已被现场证据淘汰的旧方案复活，调查又漏掉失败经验，未先纠正此前验收前提并收缩到同路径验证。
  layer: Judgment Integrity
  source_text: 11 月 5 日已经通过真实现场证据确认该 ThinkPad 为 Workgroup、Edge Update 日志为 `is_managed=0`，并因此淘汰依赖受管 Windows 条件的 Edge Stable 产品级 `Update{GUID}` 路线。11 月 10 日新的事故证明旧治理仍有旁路：Copilot/shared Edge Update core 可以直接启动 `MicrosoftEdgeUpdate.exe /ua /installsource core`，并把下载交给 BITS / Delivery Optimization，从而在服务、计划任务和 updater 自身出站防火墙都被冻结的情况下重新 stage Edge。Agent 面对这条新证据时，第一反应却再次提出已经被前一轮现场证据淘汰的产品级策略，违反了 `ELIMINATED_ROUTES / DO_NOT_REVIVE`；随后又把 AppLocker 提升为可能主路线，在用户要求按 Reasoned Decision 重做后才回到旧证据并撤回。继续调查时，Agent 又过度集中于微软官方文档，没有主动覆盖 GitHub Issues/Discussions、Reddit、ElevenForum、Microsoft Community、Stack Exchange 等真实长期使用与失败经验，直到用户明确指出“Reasoned Decision 没写查论坛？”才补齐社区证据。最终判断才收缩为一个真正会改变选择的未知：当前机器、当前 updater、当前真实事故命令在 updater 级自动检查关闭后，是否仍能进行检查、下载并重新 stage Edge；这个未知可以由同路径现场实验直接裁决，而不需要继续生成新的完整架构。
