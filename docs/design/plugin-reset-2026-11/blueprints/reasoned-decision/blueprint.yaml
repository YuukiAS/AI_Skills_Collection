- id: T11
  lines: 76–82
  title: 继承成功路径，绑定真实终点
  problem: 重复任务重新发现环境，把中间界面当完成，又把当前实例写成长期合同并扩张范围。
  layer: Task State Integrity
  source_text: 同一台机器此前已经真实成功打开过 Asteria Atlas / Obsidian，后续只是继续查看新版本，Codex 却重新检查安装、路径和环境，并扩散到 MCP、CDP、GUI automation 与 Computer Use 权限；随后又把“Vault 已打开、停在开始页”接近当作“Atlas 已打开”，而真实地图主视图尚未出现。负责防复发的 GPT 又连续多轮追着症状重写 Prompt：先加历史优先，再加禁止 Computer Use，再加主视图完成条件，再把当前 v4 / Vault / 命令误写成长期合同，被用户纠正后才改成跨版本，随后又扩张到其他仓库和新的本机状态机制。大量改动没有对应新的合法 Decision Delta，本质是没有先区分长期不变量、动态参数和当前实例，也没有在连续同类修订后收敛。该案例要求 Reasoned Decision 强化：1）已经实际成功的设备级能力进入 CONFIRMED_FACTS / COMPLETED_ACTIONS，默认跨版本、分支、worktree 和新会话继承，直到本次直接失败证据推翻；2）当前要打开什么始终从当前权威状态动态读取，旧成功记录只复用“怎么做”，不能复用旧目标；3）SUCCESS_CRITERION 必须对应用户真正要求的最终产品界面，应用启动、Vault、开始页、README、插件加载或命令存在都不能冒充完成；4）形成长期方案前显式区分长期不变量、动态参数和本次实例，不把版本号、设备名、路径或一次权限弹窗升级成永久合同；5）没有新证据、约束变化、前提纠错或候选集合实质变化时，不得因为用户追问或出现同源症状重做整套方案；连续两次同类修订后必须停止生成下一套完整补丁，退回 Task State 收敛不变量；6）低权限已验证路径能完成时，Computer Use / Accessibility / GUI control 不得作为快速只读任务的正常 fallback，权限和人工干扰属于一级成本；7）达到真实用户终点立即停止，不再用“多检查一次”扩大风险；8）局部失败不构成扩张到其他仓库、新守护机制或新状态系统的理由，除非有 Gap Proof。
