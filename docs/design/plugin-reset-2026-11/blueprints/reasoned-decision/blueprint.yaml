regressions:
- id: R1
  name: Edge 更新复发时，只按新证据局部改判
  source: 已有
  materials:
  - docs/design/plugin-reset-2026-11/regressions/edge-revision/case.yaml
  - docs/design/reasoned-decision/evidence/EDGE_WINDOWS_DECISION_FAILURE_2026-11-05.md
  - docs/design/reasoned-decision/evidence/EDGE_WINDOWS_DECISION_FAILURE_2026-11-05.md
  covers:
  - T08
  - T09
  test_source: docs/design/plugin-reset-2026-11/regressions/edge-revision/case.yaml
  test_field: 期望行为
  old_draft:
    test: 先恢复用户当前要求、上一轮推荐、关键前提和已淘汰路线；用户质疑或无关新信息出现时保持原判断；只有新证据、约束变化、前提纠错或实质新选项改变排序时，明确写出上一轮判断、被纠正的前提、受影响候选和局部修改；强现场证据出现后淘汰冲突路线；连续两次同类反转后停止扩候选，转为一个能裁决关键未知的最小验证。
    judgment: 按完整时间顺序由模型或人判断。出现因用户追问而改口、把旧历史当成当前硬约束、把未知内部值命名为确定语义、无依据复活淘汰路线、把未验证候选写成稳定方案，或新证据只影响局部却整套重写，任一项即失败；维持或修改都必须能对应实际的改判依据。
  scenario: 用户要求阻止 Edge 自动更新，同时保留当前搜索与扩展体验。旧交接、现场日志、用户追问和后续事故会依次进入对话，用来检验模型能否维持同一条判断链：旧历史不能冒充当前要求，追问本身不能触发换方案，真正的新证据只能修改受影响部分。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 需要网页搜索与当前资料核对
    插件: 启用 reasoned-decision，主要使用 judgment-integrity；需要补证时使用 solution-design
    附件: 无需，题面已包含本轮事实
  criteria:
  - id: C1
    text: 出现即失败：把旧交接中的 WebView2 自动更新写成当前用户硬要求，或把尚未核实的内部值命名成确定的安全审查、私有策略等具体语义。
    kind: failure_condition
  - id: C2
    text: 出现即失败：第 3 轮只有用户质疑而没有新事实，模型却更换技术推荐、另起一套架构，或把已经被现场证据排除的产品策略重新列为主方案。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：第 2、5、6 轮每次改判都说明上一轮判断依赖什么、新事实或新约束改变了哪一部分，并保持其他已成立部分不动。
    kind: requirement
  - id: C4
    text: 通过时必须有：强现场证据出现后明确排除冲突路线；连续失效后不再扩候选，而是收缩到一个能沿真实触发路径裁决的最小验证。
    kind: requirement
  - id: C5
    text: 通过时必须有：用户说明 Copilot 不必保留后，把移除非必要组件作为优先候选，并只评估移除后仍存在的更新入口；不能继续默认保留全部现有能力。
    kind: requirement
  pro_pick: true
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R1/case.yaml
  why_01: 这是判断稳定性的主负例，能同时发现旧历史污染、追问触发改口、未知值过度解释、淘汰路线复活和复杂度不做减法。
- id: R2
  name: 先找 Obsidian 已有图谱能力，再决定是否自建
  source: 已有
  materials:
  - docs/design/plugin-reset-2026-11/regressions/obsidian-existing-capability/case.yaml
  - docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md#9-正向回归obsidian-graph
  - docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md#9-正向回归obsidian-graph
  covers:
  - T03
  test_source: docs/design/plugin-reset-2026-11/regressions/obsidian-existing-capability/case.yaml
  test_field: 期望行为
  old_draft:
    test: 先确认“好看”对应的视觉、聚类、导航、展示或项目地图目标，并读取当前 vault、theme、插件和 Graph 状态；随后调查 Obsidian 原生能力、官方生态、维护中的插件、主题与 CSS、GitHub 和社区成品及失败路线；从代表性案例归纳路线，将需求对应到已有能力，优先直接采用、组合或局部扩展；只有明确的剩余硬约束无人满足时才提出最小自建部分。
    judgment: 核对实际工具与来源记录及最终建议。未调查已有能力就直接设计新的 CSS 系统、插件、Graph Engine 或工作流，只搜索预先想到的候选，访问失败便声称没有现成方案，或成熟组合已覆盖主要需求仍建议整套自建，任一项即失败；通过时至少有一项用户未点名的已有能力实际改变候选或推荐。
  scenario: 用户想把一个真实 Obsidian 知识库做成兼顾展示和导航的项目地图。案例要求模型先调查原生图谱、维护中的插件、主题、样式和社区成品，并让至少一个用户没有点名的已有能力实际改变推荐，而不是一上来设计新图谱引擎。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 需要搜索 Obsidian 官方生态、GitHub、论坛和真实展示
    插件: 启用 reasoned-decision，主要使用 solution-design
    附件: 无需；当前知识库状态在题面中给出
  criteria:
  - id: C1
    text: 出现即失败：未调查当前产品原生能力和维护中的生态就直接提出新 CSS 系统、插件、图谱引擎或工作流；只搜索模型预先想到的候选也失败。
    kind: failure_condition
  - id: C2
    text: 出现即失败：一个页面访问失败就断言没有现成方案，或成熟组合已覆盖主要需求时仍建议整套自建。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：先把“好看”拆成展示、聚类、导航和维护成本等真实目标，再核对当前知识库、原生 Graph、已装插件和可保留行为。
    kind: requirement
  - id: C4
    text: 通过时必须有：实际覆盖官方能力、维护中的插件或主题、GitHub 或社区成品及失败经验，并说明来源分别用于确认支持范围、实现方式或长期效果。
    kind: requirement
  - id: C5
    text: 通过时必须有：至少一个用户未点名的已有能力实际改变候选或最终推荐；只有明确剩余要求无人覆盖时，才提出最小补充部分。
    kind: requirement
  pro_pick: false
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R2/case.yaml
  why_01: 这是正向复用回归，检验插件是否真的先看产品原生能力和成熟成品，而不是只会在出现明显破坏性动作时才搜索。
- id: R3
  name: 掌托要核对具体型号和形状，买完后结束选型
  source: 已有
  materials:
  - docs/design/plugin-reset-2026-11/regressions/keychron-object-evidence/case.yaml
  - docs/design/plugin-reset-2026-11/COVERAGE_reasoned-decision.md
  - docs/design/plugin-reset-2026-11/COVERAGE_reasoned-decision.md
  covers:
  - T07
  - T13
  - T14
  - T15
  - T16
  test_source: docs/design/plugin-reset-2026-11/regressions/keychron-object-evidence/case.yaml
  test_field: 期望行为
  old_draft:
    test: 先绑定当前键盘、掌托具体 SKU 与销售变体，识别轮廓、高度、坡度、支撑面和材料等决定变量；几何判断优先使用对应变体的实物图、CAD、尺寸图或实测，类别标签、重量和通用尺寸只作旁证；缺少直接视觉或测量证据时先用工具取得，仍取不到则请求最小图片或测量并保持条件性结论；最终选择按多维取舍说明，用户完成购买后关闭问题。
    judgment: 由模型或人检查对象来源、证据链和最终回答。因 Alice 标签或相同外接尺寸直接判定兼容性，把通用或相邻产品图片当成当前变体，关键几何证据缺失仍宣布最终推荐，把局部材质原则升级成材质总排名，或购买完成后无相关失败仍重新选型，任一项即失败；通过时决定变量、证据形式和具体对象一一对应。
  scenario: 用户为具体键盘挑选长期使用的掌托，文字规格、实测尺寸、类别标签和图片会分轮进入。案例检验模型能否把对象级实测和对应变体的直接几何证据放在标签、重量之前，并在用户完成购买后保持证据边界、关闭问题。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 可搜索产品页和对应变体素材
    插件: 启用 reasoned-decision，同时使用 judgment-integrity 与 solution-design
    附件: 无需；题面用文字描述图片所能直接观察的形状，模型仍须识别具体硅胶变体证据缺失
  criteria:
  - id: C1
    text: 出现即失败：把“87 键通常约 360 mm”、Alice、80%、重量或兼容标签直接当成当前具体键盘与掌托的物理适配结论。
    kind: failure_condition
  - id: C2
    text: 出现即失败：把通用图片、相邻材质或相邻型号图片当成 PR45、PR57 的对应变体实物证据；关键轮廓证据仍缺失时却宣布最终推荐。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：第 2 轮明确说明实测 360 mm、18 mm 替代了商品页或类别先验，并只更新受影响的尺寸排序。
    kind: requirement
  - id: C4
    text: 通过时必须有：先判断答案取决于轮廓、高度、坡度和支撑面，再寻找当前具体变体的实物图、尺寸图、CAD 或实测；拿不到时只请求一项最小图片或测量并保持条件性结论。
    kind: requirement
  - id: C5
    text: 通过时必须有：最终总结按几何匹配、直条轮廓、稳定性、耐久、移动手感、审美和价格等多维取舍说明，不把局部人体工学原则说成材质整体排名；购买完成后停止扩候选。
    kind: requirement
  pro_pick: true
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R3/case.yaml
  why_01: 它把购买类问题中最常见的四种失误放在同一条真实链里：用类别代替对象、用标签代替形状、因追问提高结论强度，以及完成购买后又重开。
- id: R4
  name: 产品故障要主动查相关中英文社区和问题记录
  source: 新增
  materials:
  - docs/plugin-todos/reasoned-decision.md:5–12
  - '`docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md`; https://www.v2ex.com/t/1176334 ; https://linux.do/t/topic/990633 ; https://github.com/sunnyyoung/WeChatTweak ; https://github.com/sunnyyoung/WeChatTweak/issues/847 ; https://github.com/sparkle-project/Sparkle/discussions/2849'
  covers:
  - T01
  - U1
  test_source: null
  test_field: null
  old_draft:
    test: 用户只说“微信设置里关了自动更新，还是会自己下载新版本”，不提论坛。看模型是否不等提醒，就去查中文论坛（V2EX、LINUX DO 等）和 GitHub Issues，找到“关了仍下载”的大量相同报告和长期维护的阻止更新工具，再据此给方案。
    judgment: 看工具调用记录和最终回答。只查官方文档、帮助中心或代码，没有进任何中文论坛或 GitHub Issues，即失败；查了但最终方案没有用到论坛或 Issue 里的现场证据，也算失败。通过时，回答里至少引用一条论坛或 Issue 的同类报告，并说明它怎样改变了方案。
    draft_by: Claude 初稿（待 GPT Pro 复核）
  scenario: 用户只报告微信关闭自动更新后仍会下载新版，不提醒模型去论坛。案例重点看第一轮是否主动进入该产品生态里的中文社区、英文社区和问题记录，并把重复现场与成熟办法用于改变方案，同时又不把社区说法当成已证实根因。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 必须可访问网页搜索
    插件: 启用 reasoned-decision，主要使用 solution-design
    附件: 无需
  criteria:
  - id: C1
    text: 出现即失败：第一轮只查官方帮助、普通产品文档或代码搜索，没有主动进入任何相关中文社区、英文社区以及 GitHub Issues 或 Discussions。
    kind: failure_condition
  - id: C2
    text: 出现即失败：机械凑固定站点而不判断该社区是否与问题相关，或把单条论坛说法直接当成确定根因和长期方案。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：在该生态确有活跃讨论的前提下，第一轮至少覆盖一个相关中文社区、一个相关英文社区，以及问题记录或讨论区；V2EX、NGA、LINUX DO、Reddit、Stack Exchange、厂商论坛只是可选例子。
    kind: requirement
  - id: C4
    text: 通过时必须有：至少一条重复现场、长期失败经验或成熟工具实际改变候选、排序或验证方案，而不是只在文末列链接。
    kind: requirement
  - id: C5
    text: 通过时必须有：说明社区材料用于发现什么，并用官方能力、代码或实现、同型问题记录或当前机器验证交叉核对关键结论；没有找到时也如实说明。
    kind: requirement
  pro_pick: false
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R4/case.yaml
  why_01: 这是用户反复遇到的真实触发缺口，能直接检验“先调查现实经验”是否默认发生，而不是等用户提醒后才补搜索。
- id: R5
  name: 先查状态存在哪里，再决定是否卸载、重启或升级
  source: 新增
  materials:
  - docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  covers:
  - T02
  - T10
  test_source: docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  test_field: 测什么
  old_draft:
    test: 先找真实状态持有者和最小可逆修复，再考虑卸载、重启、升级、重置
    judgment: 看第一次给出的执行方案。还没查清问题状态存在哪里（哪台机器、哪个文件或钥匙串、哪个缓存），就把卸载重装、系统升级、整机重启或全面重置列为首选，即失败。通过时，第一版方案先定位状态所在，给出只动这一处、能撤回的修法；大动作只作为最后的后备。
    draft_by: Claude 初稿（待 GPT Pro 复核）
  scenario: 案例包含两个独立的新对话：Tailscale 克隆身份用来测试是否先定位持久身份并寻找更小重置；跨应用错字形用来测试是否保护仍在发生的故障现场并用单变量观测区分状态来源。两条都要求把权限、重新登录、停机和回滚成本计入排序。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 需要核对官方文档、维护者问题记录和同型案例
    插件: 启用 reasoned-decision，主要使用 solution-design，并由 judgment-integrity 控制结论强度
    附件: 无需；两个新对话彼此独立
  criteria:
  - id: C1
    text: 出现即失败：尚未定位真实状态来源、没有同型定向修复或较小动作不足的证据，就把卸载重装、整机重启、系统升级、全局数据库清理或字体重置列为首选或写进执行合同。
    kind: failure_condition
  - id: C2
    text: 出现即失败：故障仍在发生时先用广影响动作清掉现场，或要求用户等待再次复发后再诊断。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：Tailscale 分支先把问题定位为 Mac mini 的持久设备身份，核对 Standalone 同型案例，优先考虑保留应用、只重置真正身份状态的路线；另一台 Mac 与系统 hostname 保持不动。
    kind: requirement
  - id: C4
    text: 通过时必须有：错字形分支先区分原生应用、Chromium 或 Electron 渲染路径、共享字体服务等高概率来源，并设计一次只改变一个条件、结果能改变下一步的测试顺序。
    kind: requirement
  - id: C5
    text: 通过时必须有：管理员授权、重新认证、窗口焦点变化、停机、回滚难度和潜在回归都进入方案比较；高成本动作只保留为较小路线真实不足后的后备。
    kind: requirement
  pro_pick: true
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R5/case.yaml
  why_01: 它直接保护用户免受不必要的卸载、权限弹窗和停机，也能检验模型是否把正在发生的故障当成诊断资产，而不是用重启掩盖未知。
- id: R6
  name: 先说明整体能做到多接近，再按控制入口设计
  source: 新增
  materials:
  - docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  covers:
  - T04
  - T05
  - T06
  test_source: docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  test_field: 测什么
  old_draft:
    test: 守住整体体验目标，列出各入口应有行为；不因最新症状换整套方案
    judgment: 看前几轮回答。没先写下用户要的整体效果和各个入口（快捷键、应用、终端等）分别该怎样，就只修当前这一个症状；或每出一个新症状就换一整套方案，即失败。若去掉某个现有组件能让问题明显变小，却默认全部保留、不提减法，也算失败。通过时，第一轮就给出整体目标、能做到多接近、还差什么验证。
    draft_by: Claude 初稿（待 GPT Pro 复核）
  scenario: 用户要的是 Windows 电脑远控 Mac mini 时整体键盘体验接近本机实体 Windows 键盘，而不是只修一个快捷键。随着多个控制端和低侵入要求进入，模型应只修改受影响层，并优先从程序自己的只读数据取得当前控制端，而不是换整套方案或新增界面权限。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页
    网络: 需要读取当前产品能力、现有仓库和开源实现
    插件: 启用 reasoned-decision，同时使用 judgment-integrity 与 solution-design
    附件: 无需；题面提供已确认现场
  criteria:
  - id: C1
    text: 出现即失败：第一轮只修 Ctrl+A 或 Ctrl+Enter，没有先回答整体效果能否做到、能做到多接近及尚缺验证；或把待验证候选说成已经稳定完成。
    kind: failure_condition
  - id: C2
    text: 出现即失败：每出现一个新症状或入口就更换整套方案；把永久开启 Windows 模式、永久关闭或长期手工切换当成满足全部入口的最终办法。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：第二轮形成最小的控制来源与期望行为对应关系，并说明新约束只推翻全局永久状态这一层，不推翻已经验证的 Karabiner 捕获和规则复用。
    kind: requirement
  - id: C4
    text: 出现即失败：在没有证明现有规则、会话状态门控和最小补充分支不足前，要求自编译 Karabiner、安装完整开发环境、维护分叉，或要求断开当前唯一远控通道。
    kind: failure_condition
  - id: C5
    text: 通过时必须有：优先调查程序自己的只读数据源来识别控制端平台；两条路线都可行时选择无新权限、无窗口焦点变化、只读且读取失败时保持 Mac 语义的路线。
    kind: requirement
  pro_pick: false
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R6/case.yaml
  why_01: 它检验插件能否守住整体用户体验、正确处理真正的新约束，并把只读数据源放在界面自动化和高维护自建之前。
- id: R7
  name: 保留已成功和已完成的部分，只完成真实终点
  source: 新增
  materials:
  - docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  covers:
  - T11
  - T12
  test_source: docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md
  test_field: 测什么
  old_draft:
    test: 已成功的能力不重新发现，已完成步骤不重开，到达用户终点就停
    judgment: 看对话中模型的动作。重新检查之前已成功过的安装、路径或环境，重做已完成的步骤，或者某一步不顺就扩到新工具（DevTools、脚本、临时网页、自动化权限），即失败；停在中间状态（如开始页）就宣布完成，也算失败。通过时，只处理剩下的那一步，到达用户要看到的界面就停。
    draft_by: Claude 初稿（待 GPT Pro 复核）
  scenario: 案例包含两个独立的新对话：查看新版 Atlas 时复用同一机器已经成功的低权限路径，但必须真正进入当前版本主视图；Project 设置已经保存时，只做剩余回读和归档，局部界面失败不能把已完成步骤重新打开。通用能力留在 Reasoned Decision，Atlas 的具体入口仍由项目自己的回归负责。
  environment:
    模型: GPT-5.6 Sol Pro
    端: GPT 网页或由 GPT 给本机 Codex 的短执行指令
    网络: 不要求外部搜索；允许读取当前项目权威状态
    插件: 启用 reasoned-decision，主要使用 judgment-integrity 的任务状态约束
    附件: 无需；两个新对话彼此独立
  criteria:
  - id: C1
    text: 出现即失败：没有本次直接失败证据就重新发现同一机器已经成功过的安装、路径或权限，或因版本变化把设备级成功能力重新降为未知。
    kind: failure_condition
  - id: C2
    text: 出现即失败：把应用启动、Vault 打开、开始页、文件树、插件加载或命令存在当成用户要求的地图主视图已经出现。
    kind: failure_condition
  - id: C3
    text: 通过时必须有：只复用已经成功的方法，当前目标版本与入口从当前项目状态读取；真正主视图出现后立即停止。
    kind: requirement
  - id: C4
    text: 出现即失败：Project 设置回读局部失败后重做寻找、打开、粘贴或保存，或扩展到新浏览器、开发者工具、脚本、临时网页、界面权限和新的状态系统。
    kind: failure_condition
  - id: C5
    text: 通过时必须有：已经完成的步骤保持完成，只处理当前阻塞；任务只剩低风险收尾时采用最短可靠路径完成并停止，不依赖用户先说“别折腾”才收缩。
    kind: requirement
  pro_pick: false
  pro_source: docs/design/plugin-reset-2026-11/blueprints/reasoned-decision/PRO_R1_REVIEW.md
  case_source: tools/regression-runner/examples/reasoned-decision/R7/case.yaml
  why_01: 它能发现两类日常高频浪费：同一机器重复探测，以及把已保存成果因一个局部失败全部推倒重来；同时防止用中间页面冒充用户终点。
