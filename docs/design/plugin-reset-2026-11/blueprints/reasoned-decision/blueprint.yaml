- id: T10
  lines: 69–75
  title: 保住故障现场，后置高成本重置
  problem: 未区分高概率状态持有者就先升级或重启，既增加中断成本又抹掉可用于诊断的现场。
  layer: Solution Design
  source_text: 用户现场已经同时观察到 Edge 与飞书把正确中文随机绘制成另一批合法汉字，而英文、数字、代码片段大多正常。Agent 虽然逐步识别到这更像 glyph/font-face 映射或渲染缓存状态错误，却在尚未区分“macOS 字体注册 / renderer font cache 状态失配”和“Chromium/Electron GPU glyph atlas / renderer cache 损坏”这两个高概率根因族时，就把系统升级、整机重启和广泛字体重置提升到主路径。用户明确指出系统更新与重启的中断成本很高，这类动作只能是保底。继续开放式调查发现：Mozilla 已有同型 macOS ARM64 错字形案例，应用级清缓存和软件渲染均无效而 `killall fontd` + 重开应用立即恢复；Chromium 2026 年已经专门修过 macOS 字体注册变化未可靠传到 renderer、需要主动失效字体缓存的问题；同期 Ghostty 也有 CJK codepoint 被绘成另一字体同编号 glyph、改变字号即可恢复的现场。这些证据共同说明当前最需要裁决的不是“要不要升级系统”，而是故障状态到底由共享字体服务/字体面映射还是 renderer/GPU 路径持有。中央插件应新增并强化以下通用要求：1）系统升级、整机重启、重新登录、全局数据库重建等广影响 reset 必须显式计入 human-time、停机、中断、回滚和潜在回归成本，默认不得排在局部、可逆、单变量诊断之前；2）如果故障当前仍在发生，故障现场本身是诊断资产，应先利用现状做最小 A/B 裁决，禁止先用重启/升级把现场抹掉再要求用户等待复发；3）存在两个以上高概率 state owner 时，先冻结唯一会改变路线的未知，再设计一次只改变一个变量的验证，不得任选一个根因直接宣称“长期修复”；4）外部同型案例只能提升候选概率，不能替代当前机器验证；5）高成本 fallback 需要 Gap Proof——只有更小、可逆、局部动作已经证明不足，或上游证据明确表明只有系统级变更能解决，才允许升级；6）用户明确给出的“不要把系统升级/整机重启当优先动作”属于 Task State 硬约束，不能被通用排障模板覆盖。
  user_words:
  - “不要把系统升级/整机重启当优先动作”
  user_word_lines:
  - 73
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 系统升级、整机重启这类打断大的动作排在最后。故障正在发生时，先利用现场做最小的对比测试。
    case: Edge 和飞书把中文画成别的字，模型先推荐升级系统、整机重启。别人遇到同样问题时，重启字体服务、重开应用就好了。
    status: 约束适当
    change: 只改措辞
    rule_id: SD-06
    rule_quote: ……并尽量保留正在发生的现场。选择能区分主要解释的最小观测；重启、升级、重置和重装须有较小动作不足的依据。
    why: 要求先利用现场做最小的测试，再加上大动作必须给理由，两条一起把升级、重启压到了后面。
    proposal: 意思保持不变，把“最小观测”换成大白话：“故障还在发生时，先做一个能分清几种可能原因的小测试，再动系统。”
