  user_word_lines: []
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 同一台机器上成功过的做法直接沿用；“完成”按我真正要看到的界面算。
    case: 之前已经成功打开过 Asteria Atlas，看新版本时模型重新检查安装和环境，扩到各种自动化权限；最后停在开始页，就当成“已打开”。
    status: 约束不足
    change: 补充；挪进正文
    rule_id: TS-03 / TS-08
    rule_quote: 同一环境已经验证成功的能力继续沿用；新会话、版本号变化或用户追问本身不触发整套重新发现。　SUCCESS_CRITERION 成立后记录完成并停止展开。
    why: 要求写清了，完成标准也定义为“用户实际看到什么”。但同样放在附属文件里。
    proposal: 内容不变，挪进正文，并补半句：“程序启动了、停在开始页或中间页，都不算完成。”
  pro: '### T11：保留通用部分，把 Atlas 细节移回项目


    T11 不应整条删除，也不应把 Atlas 的版本、Vault、命令、路径和权限现象全部写进 Reasoned Decision。插件只保留两个跨任务都会复发的判断：同一环境已经真实成功的做法，在没有本次直接失败证据时继续沿用；完成标准必须对应用户真正要看到的结果，中间页面不能冒充完成。


    Atlas 的具体入口、当前版本怎样定位、哪一个地图页面算主视图，以及打开失败时允许哪些后备路线，应移到 Asteria Atlas 项目自己的打开与验收回归。若执行阶段还需要“只做剩余动作、到终点即停”的通用约束，由 workflow-core 承接；Reasoned Decision 不复制一套 Atlas 操作手册。R7 只测试前述通用判断。


    ### T11：不同意把整条内容原样挪进技能正文


    “复用同一环境已经成功的做法”和“按真实用户终点判断完成”属于 Reasoned Decision；Atlas 版本、Vault、命令、路径、权限弹窗与地图入口属于项目自己的操作和验收合同。整条搬入会把单个产品事故写成中央插件长期规则。应按第 2 节拆分。'
- id: T12
  lines: 83–89
  title: 已完成的低风险任务只收尾
  problem: 已保存的内容被反复重开，局部 GUI 失败后不断换工具与重建入口，未消费现场和用户收尾约束。
  layer: Task State Integrity
  source_text: 用户已经创建 Asteria Project，完整 setting 已准备好，随后实际正文已经粘贴并点击保存；此时剩余任务最多只是重新打开设置做一次轻量回读，再把中央配置仓库归档。Agent 却没有持续消费 COMPLETED_ACTIONS / CURRENT_QUESTION / SUCCESS_CRITERION，而是反复把已完成的“寻找 Project、打开设置、粘贴正文、选择浏览器”重新变成当前问题。第一次 Edge/UI 操作不顺后，又不断扩张到 DevTools、Accessibility、DOM、临时 HTML 校验页、Python 中转、标签页恢复和重新发现项目入口，甚至把用户已经准备好的设置窗口退出后再要求用户重新打开。用户多次明确要求“不要再折腾、只收尾、尽快完成”，这些新的硬约束也没有真正进入后续决策。该案例要求 Reasoned Decision 强化：1）每次动作后必须更新并真实消费 COMPLETED_ACTIONS、CLOSED_QUESTIONS 与唯一剩余动作；已经完成的步骤没有直接失败证据时不得复活；2）SUCCESS_CRITERION 一旦只剩一个低风险机械终点，应自动降级为最短可靠路径，不得继续沿用前一阶段的重型审计或设计流程；3）局部 GUI/工具失败后的默认恢复是保留已有成果、收缩到当前最小阻塞，不是增加新的浏览器、DOM、脚本、校验器、自动化框架或重新发现整条入口；4）如果用户已经把界面准备到目标位置，Agent 必须消费该现场状态，禁止为了“可重复性”重新导航或重建入口；5）用户明确要求降低交互、时间和 token 消耗时，human-time、attention 和 context cost 是当前 Task State 的一级硬约束，不得被“再验证一次更稳”覆盖；6）已经存在可见、直接、低风险的验收方式时，不得为机械回读额外造校验工具；7）达到真实终点后立即停止，不再为证明完成继续扩验证；8）同一任务连续两次因为恢复动作而离终点更远时，必须停止继续尝试新工具，回到 Task State，仅保留“已完成什么、唯一还差什么、最短动作是什么”三项，再执行一次。
  user_words:
  - “不要再折腾、只收尾、尽快完成”
  user_word_lines:
  - 87
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 做完的步骤不再重做。某一步出问题时，只解决这一步，不加新工具，不重走整条路。
    case: Project 设置已经粘贴保存好，只剩回读一下。模型却反复重新找 Project、开设置、粘贴；一处界面不顺，就扩到 DevTools、脚本和临时网页。我说了好几次“别折腾，只收尾”都没用。
    status: 约束不足
    change: 重写
    rule_id: TS-03
    rule_quote: 下一步必须跳过 COMPLETED_ACTIONS，遵守 CLOSED_QUESTIONS、ELIMINATED_ROUTES 和 DO_NOT_REVIVE。
    why: 写了跳过已完成的步骤，但没写某一步出问题以后怎么办。Project 那次正是一处界面不顺，就扩出一堆新工具，还把做好的步骤推倒重来。
    proposal: 某一步出问题时，保留已经做好的部分，只处理卡住的这一步，先用最直接的办法再试一次；不引入新工具，不重走前面的步骤。我说“别折腾”时，只做剩下的那一个动作。
  pro: '### T12：去掉口令依赖，改成自动收缩


    建议规则改成：


    > 已经完成的步骤保持完成。局部动作失败时，保留现有成果，只处理当前阻塞；任务只剩一个低风险收尾动作时，采用最短可靠路径完成并停止。除非现有直接路径已经证明不可用，不新增工具、不重走前面的步骤，也不要求用户重新准备已经就绪的界面。


    这样无需用户先说“别折腾”，模型也应自动收缩；用户明确要求减少时间、交互或上下文消耗时，只会进一步强化这条约束。面向用户的规则正文使用自然中文，内部状态若必须结构化，只留在机器记录里，不进入解释和回归名称。


    ### T12：同意“约束不足”，不同意依赖用户说‘别折腾’


    模型应从已完成事实和剩余工作自动判断只需收尾。用户口令只能加强已有约束，不能成为触发正确行为的必要条件。替换文本见第 2 节，R7 会验证用户不说这句话时也必须收缩。'
