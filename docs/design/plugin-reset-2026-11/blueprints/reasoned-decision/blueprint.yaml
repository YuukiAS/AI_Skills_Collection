- id: T15
  lines: 129–160
  title: follow-up：问题表示与证据模态
  problem: 把实体适配压成文字规格比较，缺直接形状证据时继续堆代理信息，且未核实素材对应的具体变体。
  layer: Judgment Integrity
  source_text: 本案例真正失败的层级高于“漏看形状”或“少查一张图”。两条线程从一开始就选错了问题表示：用户要解决的是“一个实体掌托能否与当前键盘前缘形成合适的几何与支撑关系”，Agent 却把任务压缩成了长度、高度、SKU 标签、布局分类和重量这些文字/标量字段的比较。于是后续虽然不断增加资料，看起来越来越严谨，实际上始终在一个缺失关键维度的信息空间里做推理。358mm、18mm、Alice、300g/265g 都是真实信息，但它们不是决定“实体轮廓如何贴合”的直接观测。用户补的两张图之所以能一眼指出问题，不是因为图片比文字“更直观”，而是因为图片恰好观测到了真正决定兼容性的几何变量；这是一种 Evidence-Modality Mismatch，而不是普通的搜索不足。
  user_words:
  - “一个实体掌托能否与当前键盘前缘形成合适的几何与支撑关系”
  user_word_lines:
  - 134
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 先想清楚什么证据能直接看出答案：形状问题看图，行为问题看实测。不要拿标签、重量这些间接信息反复比较。
    case: 掌托能不能贴合键盘前沿是形状问题，模型却一直在比长度、高度、型号标签和重量。我发了两张图，一眼就看出问题。
    status: 约束不足
    change: 重写
    rule_id: JI-02
    rule_quote: 先列出真正决定成功的属性，再选择能直接观察这些属性的证据形式。类别标签、重量、名称、兼容列表和通用素材只能在其相关性得到说明后参与判断。
    why: 方向是对的，但“决定成功的属性”“证据形式”太抽象，模型读完不一定会想到“这里该去找图”，可以合法跳过。
    proposal: 重写：先想清楚答案取决于什么：取决于形状，就找实物图、尺寸图或实拍；取决于行为，就找实测或现场结果。标签、型号名、重量只能当线索，不能拿来下结论。
  pro: '### T15：改成能直接执行的人话


    建议规则改成：


    > 先判断答案直接取决于什么。看形状或空间关系，就找当前具体型号的实物图、尺寸图、CAD 或实测；看实际行为，就找日志、现场测试或运行结果。标签、型号名、重量、兼容列表和通用宣传图只能帮助找线索，不能替代直接证据。拿不到关键证据时，说明还不能定，并只请求一项最小补充。


    这条不再要求读者理解“问题表示”“证据模态”或“决定成功的属性”。相关抽象概念可以留在设计解释里，生产规则与回归判据只写可观察动作。Clear Writing 的对应待办继续保留，用于以后逐插件清理同类抽象文字。'
- id: T16
  lines: 161–184
  title: follow-up：局部原则不推出总排名，购买后关闭
  problem: 最终确认时把局部优势外推为材质整体优劣，违背前轮证据边界，且完成选择后仍有重开风险。
  layer: Judgment Integrity
  source_text: 这一轮暴露的是 Judgment Integrity 中另一类高风险漂移：模型已经得到一个“证据只能支持局部原则”的稳定结论，却在用户再次要求“最终确认”时，为了给出更强确定性，把局部证据外推成了全局排序。具体表现为：OSHA/CCOHS 可以支持“避免硬锐边、减少局部接触压力、掌托应匹配高度和轮廓”，但这些原则本身并不能推出“硅胶整体优于木托”；同时又存在其他人机工学指南偏向宽、平、较硬支撑面的证据，以及社区长期使用经验支持木托在耐久、滑动、审美和稳定性上的优势。Agent 前一轮已经正确识别“材质不是第一决定变量”，下一轮却因为用户要求一个明确选择，就重新把“软硬”提升为主判据，制造了新的无效改判。
  user_words:
  - “最终确认”
  user_word_lines:
  - 166
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 最终确认不能比之前的证据说得更满。证据只支持某条原则时，不升级成“哪个整体更好”。
    case: 证据只说明“掌托要避免硬边、要匹配高度”，我要求最终确认时，模型说成了“硅胶整体优于木托”。
    status: 约束适当
    change: 只改措辞
    rule_id: JI-09
    rule_quote: 最终确认保持原证据范围，局部优势不能自动升级成类别总排名。
    why: 明确禁止把局部结论放大成总排名。
    proposal: 意思保持不变，把“类别总排名”说成大白话：“不把只支持某一点的证据说成‘哪种整体更好’。”
  pro: ''
- id: U1
  title: 默认必查中文和英文论坛
  user_words:
  - “我需要知道是否已经包含了所有我要求的问题都必须先搜论坛(中文的v2ex, nga, 英文的reddit等), 而不是每次都要我提醒搜论坛, 否则天天搜openai doc, arxiv这种”
  note: 待办第 10 行写的是“不能机械硬编码成固定站点清单”，与用户这次的要求不一致，留给后续裁决。
  supplement: true
  lines: null
  problem: ''
  source_text: ''
  layer: ''
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 产品、工具、配置、故障、购买类问题，默认先搜论坛和 GitHub Issues，不等我提醒。中文查 V2EX、NGA、LINUX DO，英文查 Reddit、Stack Exchange、厂商论坛。纯学术问题照常查论文。
    case: 微信关了自动更新还在下载。V2EX、LINUX DO 上早有大量相同报告，GitHub 上也有长期维护的阻止更新工具，模型却只查了官方文档和代码。Edge 自动更新那次也一样，直到我问“Reasoned Decision 没写查论坛？”它才去查 Reddit 和微软社区。
    status: 约束不足
    change: 重写
    rule_id: SD-02
    rule_quote: 按需检查当前上下文与项目、用户已有仓库和已安装能力、产品原生与官方生态、成熟实现、代表性成品、高价值社区经验及长期失败路线。
    why: “按需”把查不查交给模型自己决定，它通常觉得官方文档就够了。论坛只是一长串来源里的一项，也没说具体去哪里查。
    proposal: 遇到产品、工具、配置、故障或购买问题，给方案前必须先搜论坛和 GitHub Issues：中文查 V2EX、LINUX DO、NGA 里相关的版块，英文查 Reddit、Stack Exchange 或厂商论坛。回答里写明查了哪些、找到了什么，没找到也要说。纯学术问题不受这条限制。
  pro: '### U1 与 T01：合并为一条


    U1 是对 T01 的用户裁决，不再作为第二条待办。合并后的硬要求是：


    > 处理产品、工具、配置、故障或购买问题时，给方案前主动查该生态里的问题记录和真实用户长期经验。存在活跃社区时，至少覆盖一个相关中文社区和一个相关英文社区；V2EX、NGA、LINUX DO、Reddit、Stack Exchange、厂商论坛只是例子，按问题选择，不机械凑站点。说明查了什么、哪些信息改变了判断；社区说法要与官方能力、实现或当前验证交叉核对。纯学术问题仍以论文和原始资料为主。


    这同时满足“默认查中英文论坛”和“不能把所有问题硬塞进固定站点清单”。R4 专门验证第一轮是否自动做到，而不是等用户提醒。


    ### T01 / U1：同意“约束不足”，不同意固定站点式提案


    要求必须主动覆盖中英文社区是对的，但把每次检索写死为 V2EX、LINUX DO、NGA、Reddit、Stack Exchange 和厂商论坛，会制造与问题无关的机械搜索，也会漏掉某些生态真正活跃的社区。应固定的是“相关中文社区 + 相关英文社区 + 问题记录”三类覆盖，站点只作为例子，并要求实际影响判断和交叉核对。'
  merged_into: T01
