todos:
- id: T01
  lines: 5–12
  title: 调查漏掉社区与多语言经验
  problem: 只看官网和代码搜索会漏掉长期失败经验与成熟办法，但社区说法仍需交叉核对。
  layer: Solution Design
  source_text: 冻结架构已经要求先做 Solution-Space Discovery，但真实回答仍可能把“查已有方案”执行得过窄，只看当前仓库、官方文档和普通 GitHub 代码搜索，没有主动进入该生态真正承载长期用户经验的论坛、Issue/Discussion 和本地语言社区。对于依赖未文档化产品行为、版本回归、真实兼容性或长期 workaround 的问题，这会漏掉高信号证据，并使 Agent 过早进入自行诊断或 Build。微信案例中，V2EX 与 LINUX DO 很快就出现了“设置里关闭仍自动下载/重启升级”的重复现场报告，GitHub 也存在长期维护的 WeChatTweak“阻止自动更新”能力及相关自动更新 issue；这些证据如果一开始不查，真实解空间就是残缺的。
  user_words: []
  user_word_lines: []
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 产品、工具、配置、故障、购买类问题，默认先搜论坛和 GitHub Issues，不等我提醒。中文查 V2EX、NGA、LINUX DO，英文查 Reddit、Stack Exchange、厂商论坛。纯学术问题照常查论文。
    case: 微信关了自动更新还在下载。V2EX、LINUX DO 上早有大量相同报告，GitHub 上也有长期维护的阻止更新工具，模型却只查了官方文档和代码。Edge 自动更新那次也一样，直到我问“Reasoned Decision 没写查论坛？”它才去查 Reddit 和微软社区。
    status: 约束不足
    change: 重写
    rule_id: SD-02
    rule_quote: 按需检查当前上下文与项目、用户已有仓库和已安装能力、产品原生与官方生态、成熟实现、代表性成品、高价值社区经验及长期失败路线。
    why: “按需”把查不查交给模型自己决定，它通常觉得官方文档就够了。论坛只是一长串来源里的一项，也没说具体去哪里查。
    proposal: 遇到产品、工具、配置、故障或购买问题，给方案前必须先搜论坛和 GitHub Issues：中文查 V2EX、LINUX DO、NGA 里相关的版块，英文查 Reddit、Stack Exchange 或厂商论坛。回答里写明查了哪些、找到了什么，没找到也要说。纯学术问题不受这条限制。
  pro: '### U1 与 T01：合并为一条


    U1 是对 T01 的用户裁决，不再作为第二条待办。合并后的硬要求是：


    > 处理产品、工具、配置、故障或购买问题时，给方案前主动查该生态里的问题记录和真实用户长期经验。存在活跃社区时，至少覆盖一个相关中文社区和一个相关英文社区；V2EX、NGA、LINUX DO、Reddit、Stack Exchange、厂商论坛只是例子，按问题选择，不机械凑站点。说明查了什么、哪些信息改变了判断；社区说法要与官方能力、实现或当前验证交叉核对。纯学术问题仍以论文和原始资料为主。


    这同时满足“默认查中英文论坛”和“不能把所有问题硬塞进固定站点清单”。R4 专门验证第一轮是否自动做到，而不是等用户提醒。


    ### T01 / U1：同意“约束不足”，不同意固定站点式提案


    要求必须主动覆盖中英文社区是对的，但把每次检索写死为 V2EX、LINUX DO、NGA、Reddit、Stack Exchange 和厂商论坛，会制造与问题无关的机械搜索，也会漏掉某些生态真正活跃的社区。应固定的是“相关中文社区 + 相关英文社区 + 问题记录”三类覆盖，站点只作为例子，并要求实际影响判断和交叉核对。'
- id: T02
  lines: 13–19
  title: 先找状态归属，再做破坏性恢复
  problem: 尚未查明状态由谁持有及更小同型修复，就把卸载重装写进执行合同，忽略权限与中断成本。
  layer: Solution Design
  source_text: Agent 已确认 Mac mini 与另一台 Mac 共用 Tailscale node identity，却在只读调查尚未覆盖 macOS Standalone 的同型迁移案例和持久身份实际存储位置时，就把官方“完整卸载、清状态、重装”的通用兜底流程升级成首选，并写进 Codex 执行合同，导致系统权限请求已经出现。用户必须继续追问“真的要卸载吗”“有没有不卸载的方法”，Agent 才找到 Tailscale maintainer 已验证的更小恢复路径：保留 App，只重置 Standalone 的 system-wide identity state，必要时再清该机 Tailscale-specific System Keychain identity 后重新认证。新证据足以合法撤销“卸载是必要条件”，但这些证据本应在第一次形成生产方案前由 Agent 主动发现。这里暴露的是 Solution-Space Discovery、方案状态强度、execution contract 中立性和 human-time/disruption cost 的共同缺口：官方兜底流程不能自动等于当前最小必要动作，管理员授权、重装、重新登录和网络中断也不能被当成免费成本。
  user_words:
  - “真的要卸载吗”
  - “有没有不卸载的方法”
  user_word_lines:
  - 17
  - 17
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 卸载、重装、重置之前，先查清问题具体存在哪里，找最小、能撤回的修法。
    case: 两台 Mac 共用了 Tailscale 身份，模型直接把官方“完整卸载重装”写进执行指令，系统权限弹窗都出来了。我追问“真的要卸载吗”，它才找到只重置这台机器身份、不用卸载的办法。
    status: 约束不足
    change: 补充
    rule_id: SD-06
    rule_quote: ……重启、升级、重置和重装须有较小动作不足的依据。
    why: 明确要求：想卸载、重置，必须先拿出“小办法不够”的理由。模型不能直接跳到大动作。
    proposal: 补一句：“官方文档里的完整卸载重装是最后手段，不等于最小修法。”（原规则的漏洞：模型可以拿官方文档当作“小办法不够”的依据。）
  pro: '### T02：同意“约束不足”，但只补“官方卸载是最后手段”不够


    这句话容易沦为口号。生产规则还必须要求：先定位真实状态所在，查与当前平台和安装方式同型的定向修复；没有证明较小路线不足前，不得把卸载、重装或重置预埋进执行指令。R5 用 Tailscale 克隆身份直接验证这一点。'
- id: T03
  lines: 20–26
  title: 原生能力先于脚本绕路
  problem: 尚未查完当前产品原生能力，就把需要长期维护的脚本提升为推荐。
  layer: Solution Design
  source_text: Agent 正确识别 SSH/tmux/TUI 异常结束后 iTerm2 mouse reporting 状态残留这一故障族，却在没有完成当前 iTerm2 原生 Profile 能力调查时，直接把本地 zsh `precmd` 中发送 DECRST 1000/1002/1003/1006 的 hook 升级为长期推荐。继续开放式调查后发现 iTerm2 已提供 `Restrict mouse reporting to alternate screen mode`，它能在保留 tmux/TUI alternate-screen mouse reporting 的同时，把普通 shell prompt 排除在 mouse report 注入之外。新证据构成合法 Decision Delta：原生设置应先作为 Adopt 方案验证，zsh hook 只能降级为原生方案不足时的 Extend fallback。该案例要求插件把“当前产品版本的原生设置/恢复能力”明确纳入成熟产品问题的早期 Solution-Space Discovery，并要求 fallback 有明确升级条件，避免把用户不需要维护的 workaround 提前固化。
  user_words: []
  user_word_lines: []
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 成熟产品先查它自带的设置能不能解决，再考虑写脚本。
    case: iTerm2 在 SSH 断开后乱发鼠标字符，模型直接推荐在 zsh 里加一段脚本。其实 iTerm2 自带“只在全屏程序里发送鼠标事件”的选项，正好解决。
    status: 约束适当
    change: 不改
    rule_id: SD-05
    rule_quote: 依次考虑直接采用、组合、局部扩展和最小自建。提出自建时须列出实际检查的现成路线、它们已覆盖的部分、仍未满足的硬约束……
    why: 先后顺序写死了，而且想自己做就必须先列出查过哪些现成办法。模型跳过这一步就是明显违规。
    proposal: 不改。SD-02 已把产品原生能力列为必查来源。
  pro: '### T03：不同意“约束适当”


    现有复用顺序只能阻止从成熟方案直接跳到整套自建，却不能阻止把命令行钩子、包装脚本或其他脚本称为“小范围扩展”并提前推荐。iTerm2 真实案例已经证明模型会这样绕过。因此成熟产品问题还需明确要求先核对当前版本原生设置和恢复能力，原生路线真实不足后才升级到脚本。R2 用更宽的成熟生态正向案例验证这一顺序。'
- id: T04
  lines: 27–34
  title: 局部症状接管整体体验
  problem: 逐个修局部机制却没冻结整体成功标准，连续推翻后仍生成整套方案，也未说明能做到多接近及尚缺的验证。
  layer: Task State Integrity
  source_text: 用户真正要的是“Legion 远控 Mac mini 时，键盘体验尽量与直接使用 Mac mini 上的 Dell Windows 键盘一致，同时不把现有 Karabiner 搞成两套难维护配置”。Agent 前几轮却依次把问题缩成 ChatGPT 的 `Ctrl+Enter`、建议 UU 全局 `Ctrl -> Command`、再转向“只开 CGEventTap fallback”，每轮都抓住了一个局部机制，却没有先冻结整体成功标准，也没有在连续方案被新事实推翻后收缩到唯一关键未知。用户因此必须不断补充 `Ctrl+A`、Terminal 语义和“我要和实体操作一样”的要求，最后显式要求按 Reasoned Decision 重做。重新读取 Local Compute canonical、调查 Karabiner 原生能力和设备身份限制后，才收敛为“优先复用现有 Windows 键盘语义，只解决 UU 输入如何进入同一处理体系以及无设备身份的残余差距”，并正确把它保持为待现场验证的候选，而不是已经完成的长期方案。该案例要求 Reasoned Decision 在非平凡故障中把用户的整体体验目标当作 Task State，而不是让最新症状接管问题；连续两次路线被推翻后必须停止继续生成完整新方案，先找唯一真正改变选择的未知；成熟产品和已有 canonical 必须先做能力映射，再决定 Extend；用户可见结论必须先回答“能不能做到、能做到多接近、为什么、还差什么验证”，不能用实现细节代替决策。
  user_words:
  - “Legion 远控 Mac mini 时，键盘体验尽量与直接使用 Mac mini 上的 Dell Windows 键盘一致，同时不把现有 Karabiner 搞成两套难维护配置”
  - “我要和实体操作一样”
  user_word_lines:
  - 31
  - 31
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 先确认我要的整体效果，先回答“能不能做到、能做到多接近、还差什么验证”。不要每出一个新症状就换一整套方案。
    case: 我要用 Legion 远控 Mac mini 时，键盘手感和直接用本机一样。模型先只修 Ctrl+Enter，再建议全局改键，又换成另一个后备方案，每轮只抓一个症状，我只能不停补充要求。
    status: 约束不足
    change: 重写
    rule_id: SD-01 / TS-06
    rule_quote: 先确认用户要达到的结果、当前环境已经具备的能力……　连续两次同类方案被推翻后，停止扩候选，优先裁决一个信息价值最高的未知。
    why: 有“先确认目标”，但没要求在给方案前先告诉我能不能做到、能做到多接近。模型确认完目标，照样一个症状换一个方案；要等推翻两次才收手。
    proposal: 不是小事的问题，第一次给方案前先用两三句话回答：我要的整体效果能不能做到、能做到多接近、还差什么要验证。之后出现新症状，先说它影响整体目标的哪一部分，只改那一部分。
  pro: ''
- id: T05
  lines: 35–40
  title: follow-up：先列多入口期望
  problem: 把多设备、多角色入口当作一个永久状态开关，直到用户追问才补齐场景。
  layer: Task State Integrity
  source_text: 在主键位方案已经通过验证后，Agent 一度把“Karabiner 重启后恢复 UU 模式”理解成单一持久状态问题，先后考虑手工开关、永久开启和 LaunchAgent 恢复。用户继续说明自己会从 Legion、ThinkPad、MacBook Neo、Universal Control 和本地实体键盘多种入口操作同一台 Mac mini 后，才暴露出真正的长期成功标准：不同入口需要不同语义。这个新约束构成合法 Decision Delta，推翻的是“永久单一模式”，而不是已经成立的底层输入路径和规则复用。开放式调查又发现现有 UUyc-companion 已能读取当前控制端设备名和平台，因此最终应优先 Compose：Windows 控制端自动进入 Windows 语义，macOS 控制端和 Universal Control 保持 Mac 语义，本地实体键盘继续按设备身份处理。插件应吸收一个通用要求：只要任务涉及多个设备、身份、入口、环境或角色，且自动化行为可能因入口不同而变化，形成方案前必须先构造最小“场景/来源 → 期望行为”矩阵；不要先把一个状态开关固化成全局默认，再让用户用追问补齐遗漏场景。用户本轮还明确反馈按 Reasoned Decision 推进后更容易理解，这可作为 reader-facing judgment stability 的正向证据，但不能替代技术验证。
  user_words: []
  user_word_lines: []
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 涉及多台设备或多个入口时，先列一张“从哪里操作 → 应该怎样表现”的表，再定方案。
    case: 我会从 Legion、ThinkPad、MacBook、通用控制和本机键盘操作同一台 Mac mini。模型先做成一个全局开关，我把入口一个个补上后，它才改成按控制端自动切换。
    status: 约束适当
    change: 挪进正文
    rule_id: TS-04
    rule_quote: 多设备、多角色或多入口任务先形成最小“场景 → 期望行为”对应关系。
    why: 要求和触发条件都写清了。但这条放在附属文件里，模型要先打开那个文件才看得到。
    proposal: 内容不变，挪进技能正文，让模型一定能看到。
  pro: ''
- id: T06
  lines: 41–46
  title: follow-up：只读问题先找数据面
  problem: 已要求低侵入，仍先走 GUI 与新增权限，漏查直接提供状态的只读接口。
  layer: Solution Design
  source_text: 用户已经明确希望低侵入、尽量不用 GUI 和新增权限，Agent 也已经找到 UUyc-companion，却先沿用其 Accessibility + 主窗口读取路线，甚至准备让后台 helper 显示 UU 主界面并请求辅助功能授权。直到用户再次指出“最好不用 GUI、可以用代码看”，Agent 才继续调查 UU 的真实数据面，并找到客户端实际使用的只读设备接口 `GET /api/v1/device/groups/of/my`；响应中的 `participants_info` 已直接包含当前控制端平台和角色，最终因此实现了无 GUI、无 TCC 新权限的自动切换。插件应加入通用搜索优先级：对状态读取、连接识别、当前配置等只读任务，先查配置/状态文件、缓存数据库、日志、CLI、IPC/socket、客户端实际使用的只读 API，再考虑 GUI / Accessibility / Computer Use。GUI 自动化和 TCC 权限同样需要 Gap Proof；“现成开源项目通过 GUI 做”不能停止调查，必须继续追到其底层 state owner。两条路线都可行时，优先无权限、无焦点变化、只读、可 fail-closed 的数据面。用户已经明确低侵入偏好时，这个约束必须进入后续执行 prompt，不能等权限弹窗出现后才回头优化。
  user_words:
  - “最好不用 GUI、可以用代码看”
  user_word_lines:
  - 45
  assessment:
    by: Claude 初判（待 GPT Pro 复核）
    need: 要读取某个程序的状态时，先找它自己的数据：配置文件、日志、命令行、只读接口。界面自动化和申请新权限放最后。
    case: 要知道 UU 远控当前是哪台设备在控制，模型准备弹出 UU 主窗口并申请辅助功能权限。我提醒“最好用代码看”后，它才找到 UU 自己的只读接口，最后不用界面、不加权限就做成了。
    status: 约束不足
    change: 重写
    rule_id: SD-06
    rule_quote: 诊断故障时先定位真实状态持有者，优先读取文件、数据库、日志、命令接口、IPC 或只读 API……
    why: 这句只挂在“诊断故障”下面。UU 那次是要读当前状态，不是排查故障，模型不会想到套用这条。也没说弹窗口、申请新权限本身就是代价。
    proposal: 需要知道某个程序的当前状态时（不管是不是在排查故障），先找它自己的数据：配置文件、日志、命令行、它自己在用的只读接口。这些都拿不到时，才用界面自动化或申请新权限，并先说明为什么前面的办法不行。
  pro: ''
- id: T07
  lines: 47–53
  title: 推荐前核实对象级规格
  problem: 用类别常见尺寸代替具体对象事实，关键规格未核实便宣称最终推荐。
  layer: Judgment Integrity
  source_text: Agent 已经知道用户要为一把将长期高强度使用的键盘选择掌托，却在没有先核实该具体 Z6-87 Ultra 的真实机身尺寸时，先按“87 键 = 标准 TKL ≈ 360mm”这一类别先验排序候选，并把 365mm 的 Q3/V3 硅胶掌托和 362mm 的 HyperX TKL 提升为强推荐；甚至在关键尺寸仍未知时使用“最终推荐”“不会再改”等过强措辞。用户随后给出的当前商品规格页显示 Z6-87 Ultra 虽有 86 键，但机身宽度只有约 329mm。这个事实直接改变方案排序：此前因“75%”标签被错误排除的 327.5mm Keychron 掌托，反而在物理宽度上最接近真实键盘。这里暴露的不是单纯漏查一个数字，而是对象级关键前提没有进入 Recommendation Gate：当某个可核实规格会直接决定兼容性、人体工学、安全、成本或长期使用体验时，必须先查真实对象规格，再比较候选；类别名、配列名、行业常见尺寸和相邻型号只能用于发现候选，不能替代对象级证据。若关键前提未核实，只能给条件性推荐，不能冻结“最终选择”。
