<script id="blueprint-data" type="application/json">{"plugin": "reasoned-decision", "title": "Reasoned Decision v0.1", "font": "NotoSansSC.ttf", "sources": {"coverage": "docs/design/plugin-reset-2026-11/COVERAGE_reasoned-decision.md", "todo": "docs/plugin-todos/reasoned-decision.md", "candidates": "docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md", "skill_root": "skills/core/reasoned-decision"}, "todos": [{"id": "T01", "lines": "5–12", "title": "调查漏掉社区与多语言经验", "problem": "只看官网和代码搜索会漏掉长期失败经验与成熟办法，但社区说法仍需交叉核对。", "layer": "Solution Design", "source_text": "冻结架构已经要求先做 Solution-Space Discovery，但真实回答仍可能把“查已有方案”执行得过窄，只看当前仓库、官方文档和普通 GitHub 代码搜索，没有主动进入该生态真正承载长期用户经验的论坛、Issue/Discussion 和本地语言社区。对于依赖未文档化产品行为、版本回归、真实兼容性或长期 workaround 的问题，这会漏掉高信号证据，并使 Agent 过早进入自行诊断或 Build。微信案例中，V2EX 与 LINUX DO 很快就出现了“设置里关闭仍自动下载/重启升级”的重复现场报告，GitHub 也存在长期维护的 WeChatTweak“阻止自动更新”能力及相关自动更新 issue；这些证据如果一开始不查，真实解空间就是残缺的。", "user_words": [], "user_word_lines": []}, {"id": "T02", "lines": "13–19", "title": "先找状态归属，再做破坏性恢复", "problem": "尚未查明状态由谁持有及更小同型修复，就把卸载重装写进执行合同，忽略权限与中断成本。", "layer": "Solution Design", "source_text": "Agent 已确认 Mac mini 与另一台 Mac 共用 Tailscale node identity，却在只读调查尚未覆盖 macOS Standalone 的同型迁移案例和持久身份实际存储位置时，就把官方“完整卸载、清状态、重装”的通用兜底流程升级成首选，并写进 Codex 执行合同，导致系统权限请求已经出现。用户必须继续追问“真的要卸载吗”“有没有不卸载的方法”，Agent 才找到 Tailscale maintainer 已验证的更小恢复路径：保留 App，只重置 Standalone 的 system-wide identity state，必要时再清该机 Tailscale-specific System Keychain identity 后重新认证。新证据足以合法撤销“卸载是必要条件”，但这些证据本应在第一次形成生产方案前由 Agent 主动发现。这里暴露的是 Solution-Space Discovery、方案状态强度、execution contract 中立性和 human-time/disruption cost 的共同缺口：官方兜底流程不能自动等于当前最小必要动作，管理员授权、重装、重新登录和网络中断也不能被当成免费成本。", "user_words": ["“真的要卸载吗”", "“有没有不卸载的方法”"], "user_word_lines": [17, 17]}, {"id": "T03", "lines": "20–26", "title": "原生能力先于脚本绕路", "problem": "尚未查完当前产品原生能力，就把需要长期维护的脚本提升为推荐。", "layer": "Solution Design", "source_text": "Agent 正确识别 SSH/tmux/TUI 异常结束后 iTerm2 mouse reporting 状态残留这一故障族，却在没有完成当前 iTerm2 原生 Profile 能力调查时，直接把本地 zsh `precmd` 中发送 DECRST 1000/1002/1003/1006 的 hook 升级为长期推荐。继续开放式调查后发现 iTerm2 已提供 `Restrict mouse reporting to alternate screen mode`，它能在保留 tmux/TUI alternate-screen mouse reporting 的同时，把普通 shell prompt 排除在 mouse report 注入之外。新证据构成合法 Decision Delta：原生设置应先作为 Adopt 方案验证，zsh hook 只能降级为原生方案不足时的 Extend fallback。该案例要求插件把“当前产品版本的原生设置/恢复能力”明确纳入成熟产品问题的早期 Solution-Space Discovery，并要求 fallback 有明确升级条件，避免把用户不需要维护的 workaround 提前固化。", "user_words": [], "user_word_lines": []}, {"id": "T04", "lines": "27–34", "title": "局部症状接管整体体验", "problem": "逐个修局部机制却没冻结整体成功标准，连续推翻后仍生成整套方案，也未说明能做到多接近及尚缺的验证。", "layer": "Task State Integrity", "source_text": "用户真正要的是“Legion 远控 Mac mini 时，键盘体验尽量与直接使用 Mac mini 上的 Dell Windows 键盘一致，同时不把现有 Karabiner 搞成两套难维护配置”。Agent 前几轮却依次把问题缩成 ChatGPT 的 `Ctrl+Enter`、建议 UU 全局 `Ctrl -> Command`、再转向“只开 CGEventTap fallback”，每轮都抓住了一个局部机制，却没有先冻结整体成功标准，也没有在连续方案被新事实推翻后收缩到唯一关键未知。用户因此必须不断补充 `Ctrl+A`、Terminal 语义和“我要和实体操作一样”的要求，最后显式要求按 Reasoned Decision 重做。重新读取 Local Compute canonical、调查 Karabiner 原生能力和设备身份限制后，才收敛为“优先复用现有 Windows 键盘语义，只解决 UU 输入如何进入同一处理体系以及无设备身份的残余差距”，并正确把它保持为待现场验证的候选，而不是已经完成的长期方案。该案例要求 Reasoned Decision 在非平凡故障中把用户的整体体验目标当作 Task State，而不是让最新症状接管问题；连续两次路线被推翻后必须停止继续生成完整新方案，先找唯一真正改变选择的未知；成熟产品和已有 canonical 必须先做能力映射，再决定 Extend；用户可见结论必须先回答“能不能做到、能做到多接近、为什么、还差什么验证”，不能用实现细节代替决策。", "user_words": ["“Legion 远控 Mac mini 时，键盘体验尽量与直接使用 Mac mini 上的 Dell Windows 键盘一致，同时不把现有 Karabiner 搞成两套难维护配置”", "“我要和实体操作一样”"], "user_word_lines": [31, 31]}, {"id": "T05", "lines": "35–40", "title": "follow-up：先列多入口期望", "problem": "把多设备、多角色入口当作一个永久状态开关，直到用户追问才补齐场景。", "layer": "Task State Integrity", "source_text": "在主键位方案已经通过验证后，Agent 一度把“Karabiner 重启后恢复 UU 模式”理解成单一持久状态问题，先后考虑手工开关、永久开启和 LaunchAgent 恢复。用户继续说明自己会从 Legion、ThinkPad、MacBook Neo、Universal Control 和本地实体键盘多种入口操作同一台 Mac mini 后，才暴露出真正的长期成功标准：不同入口需要不同语义。这个新约束构成合法 Decision Delta，推翻的是“永久单一模式”，而不是已经成立的底层输入路径和规则复用。开放式调查又发现现有 UUyc-companion 已能读取当前控制端设备名和平台，因此最终应优先 Compose：Windows 控制端自动进入 Windows 语义，macOS 控制端和 Universal Control 保持 Mac 语义，本地实体键盘继续按设备身份处理。插件应吸收一个通用要求：只要任务涉及多个设备、身份、入口、环境或角色，且自动化行为可能因入口不同而变化，形成方案前必须先构造最小“场景/来源 → 期望行为”矩阵；不要先把一个状态开关固化成全局默认，再让用户用追问补齐遗漏场景。用户本轮还明确反馈按 Reasoned Decision 推进后更容易理解，这可作为 reader-facing judgment stability 的正向证据，但不能替代技术验证。", "user_words": [], "user_word_lines": []}, {"id": "T06", "lines": "41–46", "title": "follow-up：只读问题先找数据面", "problem": "已要求低侵入，仍先走 GUI 与新增权限，漏查直接提供状态的只读接口。", "layer": "Solution Design", "source_text": "用户已经明确希望低侵入、尽量不用 GUI 和新增权限，Agent 也已经找到 UUyc-companion，却先沿用其 Accessibility + 主窗口读取路线，甚至准备让后台 helper 显示 UU 主界面并请求辅助功能授权。直到用户再次指出“最好不用 GUI、可以用代码看”，Agent 才继续调查 UU 的真实数据面，并找到客户端实际使用的只读设备接口 `GET /api/v1/device/groups/of/my`；响应中的 `participants_info` 已直接包含当前控制端平台和角色，最终因此实现了无 GUI、无 TCC 新权限的自动切换。插件应加入通用搜索优先级：对状态读取、连接识别、当前配置等只读任务，先查配置/状态文件、缓存数据库、日志、CLI、IPC/socket、客户端实际使用的只读 API，再考虑 GUI / Accessibility / Computer Use。GUI 自动化和 TCC 权限同样需要 Gap Proof；“现成开源项目通过 GUI 做”不能停止调查，必须继续追到其底层 state owner。两条路线都可行时，优先无权限、无焦点变化、只读、可 fail-closed 的数据面。用户已经明确低侵入偏好时，这个约束必须进入后续执行 prompt，不能等权限弹窗出现后才回头优化。", "user_words": ["“最好不用 GUI、可以用代码看”"], "user_word_lines": [45]}, {"id": "T07", "lines": "47–53", "title": "推荐前核实对象级规格", "problem": "用类别常见尺寸代替具体对象事实，关键规格未核实便宣称最终推荐。", "layer": "Judgment Integrity", "source_text": "Agent 已经知道用户要为一把将长期高强度使用的键盘选择掌托，却在没有先核实该具体 Z6-87 Ultra 的真实机身尺寸时，先按“87 键 = 标准 TKL ≈ 360mm”这一类别先验排序候选，并把 365mm 的 Q3/V3 硅胶掌托和 362mm 的 HyperX TKL 提升为强推荐；甚至在关键尺寸仍未知时使用“最终推荐”“不会再改”等过强措辞。用户随后给出的当前商品规格页显示 Z6-87 Ultra 虽有 86 键，但机身宽度只有约 329mm。这个事实直接改变方案排序：此前因“75%”标签被错误排除的 327.5mm Keychron 掌托，反而在物理宽度上最接近真实键盘。这里暴露的不是单纯漏查一个数字，而是对象级关键前提没有进入 Recommendation Gate：当某个可核实规格会直接决定兼容性、人体工学、安全、成本或长期使用体验时，必须先查真实对象规格，再比较候选；类别名、配列名、行业常见尺寸和相邻型号只能用于发现候选，不能替代对象级证据。若关键前提未核实，只能给条件性推荐，不能冻结“最终选择”。", "user_words": [], "user_word_lines": []}, {"id": "T08", "lines": "54–60", "title": "故障复发不能复活淘汰路线", "problem": "新事故触发已被现场证据淘汰的旧方案复活，调查又漏掉失败经验，未先纠正此前验收前提并收缩到同路径验证。", "layer": "Judgment Integrity", "source_text": "11 月 5 日已经通过真实现场证据确认该 ThinkPad 为 Workgroup、Edge Update 日志为 `is_managed=0`，并因此淘汰依赖受管 Windows 条件的 Edge Stable 产品级 `Update{GUID}` 路线。11 月 10 日新的事故证明旧治理仍有旁路：Copilot/shared Edge Update core 可以直接启动 `MicrosoftEdgeUpdate.exe /ua /installsource core`，并把下载交给 BITS / Delivery Optimization，从而在服务、计划任务和 updater 自身出站防火墙都被冻结的情况下重新 stage Edge。Agent 面对这条新证据时，第一反应却再次提出已经被前一轮现场证据淘汰的产品级策略，违反了 `ELIMINATED_ROUTES / DO_NOT_REVIVE`；随后又把 AppLocker 提升为可能主路线，在用户要求按 Reasoned Decision 重做后才回到旧证据并撤回。继续调查时，Agent 又过度集中于微软官方文档，没有主动覆盖 GitHub Issues/Discussions、Reddit、ElevenForum、Microsoft Community、Stack Exchange 等真实长期使用与失败经验，直到用户明确指出“Reasoned Decision 没写查论坛？”才补齐社区证据。最终判断才收缩为一个真正会改变选择的未知：当前机器、当前 updater、当前真实事故命令在 updater 级自动检查关闭后，是否仍能进行检查、下载并重新 stage Edge；这个未知可以由同路径现场实验直接裁决，而不需要继续生成新的完整架构。", "user_words": ["“Reasoned Decision 没写查论坛？”", "“你确定吗”"], "user_word_lines": [58, 59]}, {"id": "T09", "lines": "61–68", "title": "follow-up：先做需求减法", "problem": "把系统现有能力全当必须保留，制造不必要兼容目标，忽略复杂度与维护成本。", "layer": "Task State Integrity", "source_text": "在确认 Copilot/shared Edge Update core 是本次 Edge 157 staged update 的真实触发链后，Agent 仍然默认把“保留 Copilot、保留 Copilot 自动更新、保留 WebView2 自动更新、同时永久阻止 Edge 自动更新”一起当成长期目标，因此方案迅速膨胀到产品级 policy、AppLocker/App Control、端点 inventory、BITS/Delivery Optimization 边界和手动更新例外。用户随后指出一个更基本的问题：“Copilot 直接卸了不行？”这暴露出 Reasoned Decision 在 Task State Integrity 里还缺少显式的需求必要性检查：当前机器上存在的能力，不等于用户要求长期保留的能力；历史上曾经存在的组件，也不能自动升级为必须兼容的约束。复杂度、维护面、未来回归面和用户认知负担本身都应进入方案排序。如果删除一个用户不需要的触发者就能显著缩小问题，应优先做需求减法，再判断是否还存在残余 gap。", "user_words": ["“Copilot 直接卸了不行？”"], "user_word_lines": [65]}, {"id": "T10", "lines": "69–75", "title": "保住故障现场，后置高成本重置", "problem": "未区分高概率状态持有者就先升级或重启，既增加中断成本又抹掉可用于诊断的现场。", "layer": "Solution Design", "source_text": "用户现场已经同时观察到 Edge 与飞书把正确中文随机绘制成另一批合法汉字，而英文、数字、代码片段大多正常。Agent 虽然逐步识别到这更像 glyph/font-face 映射或渲染缓存状态错误，却在尚未区分“macOS 字体注册 / renderer font cache 状态失配”和“Chromium/Electron GPU glyph atlas / renderer cache 损坏”这两个高概率根因族时，就把系统升级、整机重启和广泛字体重置提升到主路径。用户明确指出系统更新与重启的中断成本很高，这类动作只能是保底。继续开放式调查发现：Mozilla 已有同型 macOS ARM64 错字形案例，应用级清缓存和软件渲染均无效而 `killall fontd` + 重开应用立即恢复；Chromium 2026 年已经专门修过 macOS 字体注册变化未可靠传到 renderer、需要主动失效字体缓存的问题；同期 Ghostty 也有 CJK codepoint 被绘成另一字体同编号 glyph、改变字号即可恢复的现场。这些证据共同说明当前最需要裁决的不是“要不要升级系统”，而是故障状态到底由共享字体服务/字体面映射还是 renderer/GPU 路径持有。中央插件应新增并强化以下通用要求：1）系统升级、整机重启、重新登录、全局数据库重建等广影响 reset 必须显式计入 human-time、停机、中断、回滚和潜在回归成本，默认不得排在局部、可逆、单变量诊断之前；2）如果故障当前仍在发生，故障现场本身是诊断资产，应先利用现状做最小 A/B 裁决，禁止先用重启/升级把现场抹掉再要求用户等待复发；3）存在两个以上高概率 state owner 时，先冻结唯一会改变路线的未知，再设计一次只改变一个变量的验证，不得任选一个根因直接宣称“长期修复”；4）外部同型案例只能提升候选概率，不能替代当前机器验证；5）高成本 fallback 需要 Gap Proof——只有更小、可逆、局部动作已经证明不足，或上游证据明确表明只有系统级变更能解决，才允许升级；6）用户明确给出的“不要把系统升级/整机重启当优先动作”属于 Task State 硬约束，不能被通用排障模板覆盖。", "user_words": ["“不要把系统升级/整机重启当优先动作”"], "user_word_lines": [73]}, {"id": "T11", "lines": "76–82", "title": "继承成功路径，绑定真实终点", "problem": "重复任务重新发现环境，把中间界面当完成，又把当前实例写成长期合同并扩张范围。", "layer": "Task State Integrity", "source_text": "同一台机器此前已经真实成功打开过 Asteria Atlas / Obsidian，后续只是继续查看新版本，Codex 却重新检查安装、路径和环境，并扩散到 MCP、CDP、GUI automation 与 Computer Use 权限；随后又把“Vault 已打开、停在开始页”接近当作“Atlas 已打开”，而真实地图主视图尚未出现。负责防复发的 GPT 又连续多轮追着症状重写 Prompt：先加历史优先，再加禁止 Computer Use，再加主视图完成条件，再把当前 v4 / Vault / 命令误写成长期合同，被用户纠正后才改成跨版本，随后又扩张到其他仓库和新的本机状态机制。大量改动没有对应新的合法 Decision Delta，本质是没有先区分长期不变量、动态参数和当前实例，也没有在连续同类修订后收敛。该案例要求 Reasoned Decision 强化：1）已经实际成功的设备级能力进入 CONFIRMED_FACTS / COMPLETED_ACTIONS，默认跨版本、分支、worktree 和新会话继承，直到本次直接失败证据推翻；2）当前要打开什么始终从当前权威状态动态读取，旧成功记录只复用“怎么做”，不能复用旧目标；3）SUCCESS_CRITERION 必须对应用户真正要求的最终产品界面，应用启动、Vault、开始页、README、插件加载或命令存在都不能冒充完成；4）形成长期方案前显式区分长期不变量、动态参数和本次实例，不把版本号、设备名、路径或一次权限弹窗升级成永久合同；5）没有新证据、约束变化、前提纠错或候选集合实质变化时，不得因为用户追问或出现同源症状重做整套方案；连续两次同类修订后必须停止生成下一套完整补丁，退回 Task State 收敛不变量；6）低权限已验证路径能完成时，Computer Use / Accessibility / GUI control 不得作为快速只读任务的正常 fallback，权限和人工干扰属于一级成本；7）达到真实用户终点立即停止，不再用“多检查一次”扩大风险；8）局部失败不构成扩张到其他仓库、新守护机制或新状态系统的理由，除非有 Gap Proof。", "user_words": [], "user_word_lines": []}, {"id": "T12", "lines": "83–89", "title": "已完成的低风险任务只收尾", "problem": "已保存的内容被反复重开，局部 GUI 失败后不断换工具与重建入口，未消费现场和用户收尾约束。", "layer": "Task State Integrity", "source_text": "用户已经创建 Asteria Project，完整 setting 已准备好，随后实际正文已经粘贴并点击保存；此时剩余任务最多只是重新打开设置做一次轻量回读，再把中央配置仓库归档。Agent 却没有持续消费 COMPLETED_ACTIONS / CURRENT_QUESTION / SUCCESS_CRITERION，而是反复把已完成的“寻找 Project、打开设置、粘贴正文、选择浏览器”重新变成当前问题。第一次 Edge/UI 操作不顺后，又不断扩张到 DevTools、Accessibility、DOM、临时 HTML 校验页、Python 中转、标签页恢复和重新发现项目入口，甚至把用户已经准备好的设置窗口退出后再要求用户重新打开。用户多次明确要求“不要再折腾、只收尾、尽快完成”，这些新的硬约束也没有真正进入后续决策。该案例要求 Reasoned Decision 强化：1）每次动作后必须更新并真实消费 COMPLETED_ACTIONS、CLOSED_QUESTIONS 与唯一剩余动作；已经完成的步骤没有直接失败证据时不得复活；2）SUCCESS_CRITERION 一旦只剩一个低风险机械终点，应自动降级为最短可靠路径，不得继续沿用前一阶段的重型审计或设计流程；3）局部 GUI/工具失败后的默认恢复是保留已有成果、收缩到当前最小阻塞，不是增加新的浏览器、DOM、脚本、校验器、自动化框架或重新发现整条入口；4）如果用户已经把界面准备到目标位置，Agent 必须消费该现场状态，禁止为了“可重复性”重新导航或重建入口；5）用户明确要求降低交互、时间和 token 消耗时，human-time、attention 和 context cost 是当前 Task State 的一级硬约束，不得被“再验证一次更稳”覆盖；6）已经存在可见、直接、低风险的验收方式时，不得为机械回读额外造校验工具；7）达到真实终点后立即停止，不再为证明完成继续扩验证；8）同一任务连续两次因为恢复动作而离终点更远时，必须停止继续尝试新工具，回到 Task State，仅保留“已完成什么、唯一还差什么、最短动作是什么”三项，再执行一次。", "user_words": ["“不要再折腾、只收尾、尽快完成”"], "user_word_lines": [87]}, {"id": "T13", "lines": "90–98", "title": "follow-up：标签不能制造伪改判", "problem": "对象实测已稳定，仍因类别标签整套重排，没证明标签如何改变实体适配。", "layer": "Judgment Integrity", "source_text": "在用户已经提供足以裁决的实机尺寸后，Agent 仍因商品选项标签“Q8/V8=Alice”把 358mm 方案改成 365mm Q3/V3，随后又撤回。这个改口没有证明 Alice 标签对应的实体掌托几何会妨碍直板键盘，也没有先核对 Keychron 官方其实还存在普通 80% 的同尺寸 358mm 掌托，因此属于把类别标签再次提升为物理兼容性证据，制造了伪 Decision Delta。更严重的是，此前已连续多次改口，本应触发“停止扩候选、冻结实测事实、只裁决唯一剩余未知”，却仍继续整套重排。", "user_words": [], "user_word_lines": []}, {"id": "T14", "lines": "99–128", "title": "follow-up：新事实不等于相关证据", "problem": "新元数据被自动当成改判理由，搜索未转为定点验证，忽略最少假设与连续改口的时间、信任成本。", "layer": "Judgment Integrity", "source_text": "对完整对话逐轮回放后，连续改口不能归因成“资料一点点补齐，所以答案自然变化”。其中只有一部分属于合法 Decision Delta：最初基于商品页 329mm 宽度选择 337mm K14，随后用户直接实测整机前沿约 360mm、前沿高度约 18mm，这条对象级现场证据足以推翻旧宽度假设，因此 K14 → 358/365mm 候选的重排是合理的。真正失控发生在实测事实已经足够稳定之后：Agent 先因“Q8/V8 = Alice 65%”把 358mm 改成 365mm Q3/V3，却没有证明 Alice 标签对应的实体形状、接口或支撑轮廓会破坏直板键盘适配；随后发现普通 80% 也存在 358×79.5×18mm SKU 后又改回 358mm；接着找到普通 80% 的 K8 版 358mm 后本应收敛，却又在没有新尺寸、形状或真实使用失败证据时重新回到 Q8；之后又把“同尺寸 SKU 重量不同”误当成足以证明适配不同的证据。这里反复出现的不是“缺信息”，而是把“新事实”自动等同于“会改变决策的事实”，缺少 Evidence Relevance / Decision Delta Gate。", "user_words": ["“你确定吗”"], "user_word_lines": [124]}, {"id": "T15", "lines": "129–160", "title": "follow-up：问题表示与证据模态", "problem": "把实体适配压成文字规格比较，缺直接形状证据时继续堆代理信息，且未核实素材对应的具体变体。", "layer": "Judgment Integrity", "source_text": "本案例真正失败的层级高于“漏看形状”或“少查一张图”。两条线程从一开始就选错了问题表示：用户要解决的是“一个实体掌托能否与当前键盘前缘形成合适的几何与支撑关系”，Agent 却把任务压缩成了长度、高度、SKU 标签、布局分类和重量这些文字/标量字段的比较。于是后续虽然不断增加资料，看起来越来越严谨，实际上始终在一个缺失关键维度的信息空间里做推理。358mm、18mm、Alice、300g/265g 都是真实信息，但它们不是决定“实体轮廓如何贴合”的直接观测。用户补的两张图之所以能一眼指出问题，不是因为图片比文字“更直观”，而是因为图片恰好观测到了真正决定兼容性的几何变量；这是一种 Evidence-Modality Mismatch，而不是普通的搜索不足。", "user_words": ["“一个实体掌托能否与当前键盘前缘形成合适的几何与支撑关系”"], "user_word_lines": [134]}, {"id": "T16", "lines": "161–184", "title": "follow-up：局部原则不推出总排名，购买后关闭", "problem": "最终确认时把局部优势外推为材质整体优劣，违背前轮证据边界，且完成选择后仍有重开风险。", "layer": "Judgment Integrity", "source_text": "这一轮暴露的是 Judgment Integrity 中另一类高风险漂移：模型已经得到一个“证据只能支持局部原则”的稳定结论，却在用户再次要求“最终确认”时，为了给出更强确定性，把局部证据外推成了全局排序。具体表现为：OSHA/CCOHS 可以支持“避免硬锐边、减少局部接触压力、掌托应匹配高度和轮廓”，但这些原则本身并不能推出“硅胶整体优于木托”；同时又存在其他人机工学指南偏向宽、平、较硬支撑面的证据，以及社区长期使用经验支持木托在耐久、滑动、审美和稳定性上的优势。Agent 前一轮已经正确识别“材质不是第一决定变量”，下一轮却因为用户要求一个明确选择，就重新把“软硬”提升为主判据，制造了新的无效改判。", "user_words": ["“最终确认”"], "user_word_lines": [166]}, {"id": "U1", "title": "默认必查中文和英文论坛", "user_words": ["“我需要知道是否已经包含了所有我要求的问题都必须先搜论坛(中文的v2ex, nga, 英文的reddit等), 而不是每次都要我提醒搜论坛, 否则天天搜openai doc, arxiv这种”"], "note": "待办第 10 行写的是“不能机械硬编码成固定站点清单”，与用户这次的要求不一致，留给后续裁决。", "supplement": true, "lines": null, "problem": "", "source_text": "", "layer": ""}], "rules": [{"id": "JI-01", "label": "当前对象", "first_sentence": "先确认具体对象、型号或变体、环境、时点及成功标准。", "file": "skills/core/reasoned-decision/judgment-integrity/SKILL.md", "line": 23, "location_type": "skill 正文"}, {"id": "JI-02", "label": "决定变量", "first_sentence": "先列出真正决定成功的属性，再选择能直接观察这些属性的证据形式。", "file": "skills/core/reasoned-decision/judgment-integrity/SKILL.md", "line": 24, "location_type": "skill 正文"}, {"id": "JI-03", "label": "先淘汰再比较", "first_sentence": "淘汰违反硬约束、被当前事实否定、适用范围缺乏依据或没有新增价值的路线。", "file": "skills/core/reasoned-decision/judgmen ": "在比较、推荐、最终确认或新证据出现时，核对对象、证据和跨轮状态，给出稳定且可纠正的明确判断。", "file": "skills/core/reasoned-decision/judgment-integrity/SKILL.md", "rule_ids": ["JI-01", "JI-02", "JI-03", "JI-04", "JI-05", "JI-06", "JI-07", "JI-08", "JI-09", "JI-10", "TS-01", "TS-02", "TS-03", "TS-04", "TS-05", "TS-06", "TS-07", "TS-08", "TS-09"], "rule_files": ["skills/core/reasoned-decision/judgment-integrity/SKILL.md", "skills/core/reasoned-decision/judgment-integrity/references/execution-evidence.yaml", "skills/core/reasoned-decision/judgment-integrity/references/task-state-contract.md"]}, {"name": "solution-design", "description": "在改善、配置、修复或实现方案前，调查现实已有能力和失败经验，优先复用并只设计有证据的剩余缺口。", "file": "skills/core/reasoned-decision/solution-design/SKILL.md", "rule_ids": ["SD-01", "SD-02", "SD-03", "SD-04", "SD-05", "SD-06", "SD-07", "SD-08", "SD-09", "SD-10", "TS-01", "TS-02", "TS-03", "TS-04", "TS-05", "TS-06", "TS-07", "TS-08", "TS-09"], "rule_files": ["skills/core/reasoned-decision/solution-design/SKILL.md", "skills/core/reasoned-decision/solution-design/references/execution-evidence.yaml", "skills/core/reasoned-decision/solution-design/references/task-state-contract.md"]}], "shared_files": ["skills/core/reasoned-decision/shared/task-state-contract.md"], "regressions": [{"id": "R1", "name": "edge-revision", "source": "已有", "test": "先恢复用户当前要求、上一轮推荐、关键前提和已淘汰路线；用户质疑或无关新信息出现时保持原判断；只有新证据、约束变化、前提纠错或实质新选项改变排序时，明确写出上一轮判断、被纠正的前提、受影响候选和局部修改；强现场证据出现后淘汰冲突路线；连续两次同类反转后停止扩候选，转为一个能裁决关键未知的最小验证。", "judgment": "按完整时间顺序由模型或人判断。出现因用户追问而改口、把旧历史当成当前硬约束、把未知内部值命名为确定语义、无依据复活淘汰路线、把未验证候选写成稳定方案，或新证据只影响局部却整套重写，任一项即失败；维持或修改都必须能对应实际的改判依据。", "materials": ["docs/design/plugin-reset-2026-11/regressions/edge-revision/case.yaml", "docs/design/reasoned-decision/evidence/EDGE_WINDOWS_DECISION_FAILURE_2026-11-05.md", "docs/design/reasoned-decision/evidence/EDGE_WINDOWS_DECISION_FAILURE_2026-11-05.md"], "covers": ["T08", "T01"], "test_source": "docs/design/plugin-reset-2026-11/regressions/edge-revision/case.yaml", "test_field": "期望行为"}, {"id": "R2", "name": "obsidian-existing-capability", "source": "已有", "test": "先确认“好看”对应的视觉、聚类、导航、展示或项目地图目标，并读取当前 vault、theme、插件和 Graph 状态；随后调查 Obsidian 原生能力、官方生态、维护中的插件、主题与 CSS、GitHub 和社区成品及失败路线；从代表性案例归纳路线，将需求对应到已有能力，优先直接采用、组合或局部扩展；只有明确的剩余硬约束无人满足时才提出最小自建部分。", "judgment": "核对实际工具与来源记录及最终建议。未调查已有能力就直接设计新的 CSS 系统、插件、Graph Engine 或工作流，只搜索预先想到的候选，访问失败便声称没有现成方案，或成熟组合已覆盖主要需求仍建议整套自建，任一项即失败；通过时至少有一项用户未点名的已有能力实际改变候选或推荐。", "materials": ["docs/design/plugin-reset-2026-11/regressions/obsidian-existing-capability/case.yaml", "docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md#9-正向回归obsidian-graph", "docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md#9-正向回归obsidian-graph"], "covers": ["T03"], "test_source": "docs/design/plugin-reset-2026-11/regressions/obsidian-existing-capability/case.yaml", "test_field": "期望行为"}, {"id": "R3", "name": "keychron-object-evidence", "source": "已有", "test": "先绑定当前键盘、掌托具体 SKU 与销售变体，识别轮廓、高度、坡度、支撑面和材料等决定变量；几何判断优先使用对应变体的实物图、CAD、尺寸图或实测，类别标签、重量和通用尺寸只作旁证；缺少直接视觉或测量证据时先用工具取得，仍取不到则请求最小图片或测量并保持条件性结论；最终选择按多维取舍说明，用户完成购买后关闭问题。", "judgment": "由模型或人检查对象来源、证据链和最终回答。因 Alice 标签或相同外接尺寸直接判定兼容性，把通用或相邻产品图片当成当前变体，关键几何证据缺失仍宣布最终推荐，把局部材质原则升级成材质总排名，或购买完成后无相关失败仍重新选型，任一项即失败；通过时决定变量、证据形式和具体对象一一对应。", "materials": ["docs/design/plugin-reset-2026-11/regressions/keychron-object-evidence/case.yaml", "docs/design/plugin-reset-2026-11/COVERAGE_reasoned-decision.md", "docs/design/plugin-reset-2026-11/COVERAGE_reasoned-decision.md"], "covers": ["T07", "T13", "T14", "T15", "T16"], "test_source": "docs/design/plugin-reset-2026-11/regressions/keychron-object-evidence/case.yaml", "test_field": "期望行为"}, {"id": "R4", "name": "微信论坛", "source": "新增", "test": "", "judgment": "", "materials": ["docs/plugin-todos/reasoned-decision.md:5–12", "`docs/design/reasoned-decision/REASONED_DECISION_V0_1_ARCHITECTURE_2026-11-05.md`; https://www.v2ex.com/t/1176334 ; https://linux.do/t/topic/990633 ; https://github.com/sunnyyoung/WeChatTweak ; https://github.com/sunnyyoung/WeChatTweak/issues/847 ; https://github.com/sparkle-project/Sparkle/discussions/2849"], "covers": ["T01", "U1"], "test_source": null, "test_field": null}, {"id": "R5", "name": "state-owner-before-reset", "source": "新增", "test": "先找真实状态持有者和最小可逆修复，再考虑卸载、重启、升级、重置", "judgment": "", "materials": ["docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md"], "covers": ["T02", "T10"], "test_source": "docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md", "test_field": "测什么"}, {"id": "R6", "name": "whole-goal-multi-entry", "source": "新增", "test": "守住整体体验目标，列出各入口应有行为；不因最新症状换整套方案", "judgment": "", "materials": ["docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md"], "covers": ["T04", "T05", "T06", "T09"], "test_source": "docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md", "test_field": "测什么"}, {"id": "R7", "name": "completed-task-stop", "source": "新增", "test": "已成功的能力不重新发现，已完成步骤不重开，到达用户终点就停", "judgment": "", "materials": ["docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md"], "covers": ["T11", "T12"], "test_source": "docs/design/plugin-reset-2026-11/regressions/CANDIDATES_2026-11-21.md", "test_field": "测什么"}]}</script>
<script id="decisions-data" type="application/json">{"todos": {"T01": "0.1", "T02": "0.1", "T03": "0.1", "T04": "0.1", "T05": "0.1", "T06": "0.1", "T07": "0.1", "T08": "0.1", "T09": "0.1", "T10": "0.1", "T11": "0.1", "T12": "0.1", "T13": "0.1", "T14": "0.1", "T15": "0.1", "T16": "0.1", "U1": "0.1"}, "regressions": {"R1": null, "R2": null, "R3": null, "R4": null, "R5": null, "R6": null, "R7": null}}</script>
<script id="checks-data" type="application/json">[{"status": "通过", "result": "待办逐条对应：16 / 16。"}, {"status": "通过", "result": "规则第一句逐字存在：47 / 47 个文件位置。"}, {"status": "通过", "result": "未被任何回归覆盖的待办：无。"}, {"status": "待下一轮", "result": "已选 0.1 的待办，其目标规则写在 skill 正文。"}]</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('blueprint-data').textContent);
const checks=JSON.parse(document.getElementById('checks-data').textContent);
let decisions=JSON.parse(document.getElementById('decisions-data').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='plugin-blueprint:'+data.plugin;
let online=false,saveQueue=Promise.resolve(),savedTimer;
const todoById=Object.fromEntries(data.todos.map(t=>[t.id,t]));
const uncovered=data.todos.filter(t=>!data.regressions.some(r=>r.covers.includes(t.id)));
const text=s=>s?esc(s):'—';
const pills=ids=>ids.map(id=>`<span class="pill" title="${esc(todoById[id]?.title||data.regressions.find(r=>r.id===id)?.name||id)}">${esc(id)}</span>`).join('');
function segments(group,id){return `<div class="segments" role="group" aria-label="${id} 选择">${['0.1','0.2','搁置'].map(v=>`<button data-group="${group}" data-id="${id}" data-value="${v}" aria-pressed="${decisions[group][id]===v}">${v}</button>`).join('')}</div>`;}
function cards(){
 const original=data.todos.filter(t=>!t.supplement).length,extra=data.todos.length-original;
 const existing=data.regressions.filter(r=>r.source==='已有').length;
 const values=[
  [data.skills.length,'Skill',data.skills.map(s=>s.name).join(' · '),''],
  [extra?`${original} + ${extra}`:original,'待办','',''],
  [data.regressions.length,'回归',`已有 ${existing} · 新增 ${data.regressions.length-existing}`,''],
  [uncovered.length,'未被回归覆盖的待办','',''+(uncovered.length?'danger':'zero')],
  [Object.values(decisions.regressions).filter(v=>v==='0.1').length,'已选 0.1 的回归','','']];
 document.getElementById('cards').innerHTML=values.map(([n,label,sub,cls],i)=>`<div class="card"><div class="number ${cls}" data-card="${i}">${esc(n)}</div><div>${label}</div>${sub?`<div class="small">${esc(sub)}</div>`:''}</div>`).join('');
}
function ruleTable(rules){return `<div class="table-wrap"><table class="rule-table"><colgroup><col style="width:90px"><col><col style="width:130px"></colgroup><thead><tr><th>编号</th><th>第一句</th><th>位置类型</th></tr></thead><tbody>${rules.map(r=>`<tr data-rule="${esc(r.id)}" data-file="${esc(r.file)}"><td class="id">${esc(r.id)}</td><td><span class="first-sentence">${esc(r.first_sentence)}</span><span class="rule-file">${esc(r.file)}:${r.line}</span></td><td class="${r.location_type==='引用文件'?'ref':''}">${esc(r.location_type)}</td></tr>`).join('')}</tbody></table></div>`;}
function render(){
 cards();
 document.getElementById('regressions').innerHTML=`<table><colgroup><col style="width:54px"><col style="width:210px"><col><col style="width:160px"><col style="width:172px"></colgroup><thead><tr><th>编号</th><th>名称</th><th>测什么</th><th>覆盖的待办</th><th>选择</th></tr></thead><tbody>${data.regressions.map(r=>`<tr data-regression="${r.id}"><td class="id">${r.id}</td><td><div class="name">${esc(r.name)}</div><span class="tag ${r.source==='新增'?'new':''}">${r.source}</span></td><td class="test-text">${text(r.test)}</td><td>${pills(r.covers)}</td><td>${segments('regressions',r.id)} <button class="toggle" data-detail="detail-${r.id}" aria-expanded="false" aria-label="展开 ${r.id}">⌄</button></td></tr><tr class="detail" id="detail-${r.id}" hidden><td colspan="5"><p class="judgment">${text(r.judgment)}</p><p class="path">${r.materials.map(esc).join('<br>')}</p></td></tr>`).join('')}</tbody></table>`;
 document.getElementById('todos').innerHTML=`<table><colgroup><col style="width:54px"><col><col style="width:180px"><col style="width:150px"><col style="width:172px"></colgroup><thead><tr><th>编号</th><th>标题</th><th>所属层</th><th>被哪些回归覆盖</th><th>选择</th></tr></thead><tbody>${data.todos.map(t=>{
 const rs=data.regressions.filter(r=>r.covers.includes(t.id)).map(r=>r.id);
 return `<tr data-todo="${t.id}"><td class="id">${t.id}</td><td><span class="todo-title">${esc(t.title)}</span>${t.supplement?'<br><span class="tag">用户补充</span>':''}</td><td>${text(t.layer)}</td><td>${rs.length?pills(rs):'<span class="danger">无</span>'}</td><td>${segments('todos',t.id)} <button class="toggle" data-detail="detail-${t.id}" aria-expanded="false" aria-label="展开 ${t.id}">⌄</button></td></tr><tr class="detail" id="detail-${t.id}" hidden><td colspan="5">${t.problem?`<p class="problem">${esc(t.problem)}</p>`:''}${t.user_words.length?`<p class="quote">${esc(t.user_words.join('\n'))}</p>`:''}${t.source_text?`<p class="source">${esc(t.source_text)}</p>`:''}${t.note?`<p class="note">${esc(t.note)}</p>`:''}${t.lines?`<p class="path">${esc(data.sources.todo)}:${esc(t.lines)}</p>`:''}</td></tr>`;
 }).join('')}</tbody></table>`;
 document.getElementById('skills').innerHTML=data.skills.map(s=>`<div class="skill"><h3>${esc(s.name)}</h3><p class="description">${esc(s.description)}</p>${ruleTable(data.rules.filter(r=>s.rule_files.includes(r.file)))}</div>`).join('')+`<h3>共享文件</h3><ul class="shared-files">${data.shared_files.map(esc).map(f=>`<li>${f}</li>`).join('')}</ul>`+ruleTable(data.rules.filter(r=>data.shared_files.includes(r.file)));
 document.getElementById('checks').innerHTML=checks.map(c=>`<div class="check"><span class="check-status">${esc(c.status)}</span><span class="check-result">${esc(c.result)}</span></div>`).join('');
}
function offline(){online=false;document.getElementById('offline').hidden=false;}
function localSave(){try{localStorage.setItem(storageKey,JSON.stringify(decisions));}catch{}}
function saved(){clearTimeout(savedTimer);document.getElementById('saved').hidden=false;savedTimer=setTimeout(()=>document.getElementById('saved').hidden=true,2000);}
async function request(url,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2000);
 try{const response=await fetch(url,{...options,signal:controller.signal});if(!response.ok)throw Error(response.status);return await response.json();}finally{clearTimeout(timer);}
}
document.addEventListener('click',e=>{
 const toggle=e.target.closest('[data-detail]');
 if(toggle){const detail=document.getElementById(toggle.dataset.detail);detail.hidden=!detail.hidden;toggle.setAttribute('aria-expanded',String(!detail.hidden));toggle.textContent=detail.hidden?'⌄':'⌃';return;}
 const button=e.target.closest('button[data-value]');if(!button)return;
 const {group,id,value}=button.dataset;
 const next=decisions[group][id]===value?null:value;
 decisions[group][id]=next;
 button.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===next)));
 cards();localSave();
 saveQueue=saveQueue.then(async()=>{
  if(online){try{await request('api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group,id,value:next})});saved();}catch{offline();localSave();}}
 });
});
document.getElementById('export').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(decisions,null,2)+'\n'],{type:'application/yaml;charset=utf-8'});
 const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='decisions.yaml';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
});
function restoreLocal(){try{const local=JSON.parse(localStorage.getItem(storageKey));for(const group of ['todos','regressions'])for(const id of Object.keys(decisions[group]))if(local?.[group]&&Object.hasOwn(local[group],id)&&[null,'0.1','0.2','搁置'].includes(local[group][id]))decisions[group][id]=local[group][id];}catch{}}
render();
window.blueprintReady=(async()=>{
 if(location.protocol==='file:'){offline();restoreLocal();render();return;}
 try{const result=await request('api/decisions');if(result.plugin!==data.plugin)throw Error('plugin');decisions=result.decisions;online=true;localSave();render();}catch{offline();restoreLocal();render();}
})();
</script></body></html>
