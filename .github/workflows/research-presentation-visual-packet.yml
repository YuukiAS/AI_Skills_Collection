name: Research Presentation Visual Packet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-presentation-visual-packet.yml"
      - "tests/fixtures/presentations/research_group_meeting/**"
      - "skills/tools/documents-media/presentations/shared/references/**"
      - "plugins/codex/plugins/presentations/shared/references/**"
      - "automation/reviewed_handoff/tasks/011_round_handoff/**"
      - "results/011_round_handoff/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-presentation-visual-review-pages
  cancel-in-progress: false

jobs:
  visual-review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEBIAN_FRONTEND: noninteractive
      IMPLEMENTATION_COMMIT: ff8ff1ddb48cb9c511b3e3fecc7f0c4964adab46
      REVIEW_ROUND: "2"
      PACKET_DIR: .cache/research-presentation-visual-review-packet
      PAGES_DIR: .cache/research-presentation-pages
      PACKET_SOURCE_DIR: tests/fixtures/presentations/research_group_meeting/visual_review_packet_source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build visual review packet
        run: |
          python3 tests/fixtures/presentations/research_group_meeting/build_visual_review_packet.py \
            --source-dir "$PACKET_SOURCE_DIR" \
            --packet-dir "$PACKET_DIR" \
            --zip-path ".cache/research-presentation-visual-review-packet.zip" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --transport-commit "$GITHUB_SHA"

      - name: Build GitHub Pages visual review payload
        run: |
          python3 tests/fixtures/presentations/research_group_meeting/build_visual_review_pages.py \
            --source-dir "$PACKET_SOURCE_DIR" \
            --pages-dir "$PAGES_DIR" \
            --implementation-commit "$IMPLEMENTATION_COMMIT" \
            --transport-commit "$GITHUB_SHA" \
            --copy-latest

      - name: Upload visual review packet
        uses: actions/upload-artifact@v4
        with:
          name: research-presentation-visual-review-packet-${{ github.sha }}
          path: |
            .cache/research-presentation-visual-review-packet/
            .cache/research-presentation-visual-review-packet.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
