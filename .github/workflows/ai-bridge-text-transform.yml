name: AI Bridge Text Transform

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative text transform manifest path, or empty to use changed manifests
        required: false
        default: ""
  push:
    branches:
      - main
      - 'reviewed/**'
    paths:
      - 'results/**/private_style_smoke/**/text_transform_inputs.json'

permissions:
  contents: write

jobs:
  text-transform:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_REVIEW_API_KEY || secrets.OPENAI_VISUAL_REVIEW_API_KEY }}
      OPENAI_TEXT_TRANSFORM_MODEL: ${{ vars.OPENAI_TEXT_TRANSFORM_MODEL }}
      OPENAI_TEXT_TRANSFORM_TIMEOUT_SECONDS: ${{ vars.OPENAI_TEXT_TRANSFORM_TIMEOUT_SECONDS || '600' }}
      AI_BRIDGE_KIT_COMMIT: 65ea9c59afbe2db88bb5d60bf8752f82719f0087
      AI_BRIDGE_KIT_PIP_SPEC: gpt-codex-ai-bridge-kit[text-transform] @ git+https://github.com/YuukiAS/GPT_Codex_AI_Bridge_Kit.git@65ea9c59afbe2db88bb5d60bf8752f82719f0087
      AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY: ${{ secrets.AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install age
        if: env.AI_BRIDGE_TEXT_TRANSFORM_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      - name: Install Bridge Kit text transform extra
        run: python -m pip install "${AI_BRIDGE_KIT_PIP_SPEC}"

      - name: Resolve text transform manifests
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.manifest }}" ]; then
            manifests="${{ github.event.inputs.manifest }}"
          else
            manifests="$(git show --name-only --format= "${GITHUB_SHA}" | grep '^results/.*/private_style_smoke/.*/text_transform_inputs[.]json$' || true)"
          fi
          if [ -z "${manifests}" ]; then
            echo "No private style-smoke text transform manifest changed; not required."
            echo "AI_BRIDGE_TEXT_TRANSFORM_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "AI_BRIDGE_TEXT_TRANSFORM_MANIFESTS<<EOF"
            printf '%s\n' "${manifests}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Refuse missing text transform secrets
        if: env.AI_BRIDGE_TEXT_TRANSFORM_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY}" ]; then
            echo "AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY is not configured; cannot decrypt private text transform payload."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_REVIEW_API_KEY or OPENAI_VISUAL_REVIEW_API_KEY is not configured; cannot run live text transform."
            exit 1
          fi

      - name: Run private staged style-smoke transforms
        if: env.AI_BRIDGE_TEXT_TRANSFORM_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [ -n "${manifest}" ] || continue
            tmpdir="$(mktemp -d)"
            chmod 700 "${tmpdir}"
            umask 077
            printf '%s\n' "${AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY}" > "${tmpdir}/identity.txt"
            payload_path="$(python - "$manifest" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          print(manifest["input"]["encrypted_payload_path"])
          PY
            )"
            age -d -i "${tmpdir}/identity.txt" -o "${tmpdir}/source.md" "${payload_path}"
            output_age="$(dirname "${manifest}")/output.age"
            result="$(dirname "${manifest}")/TEXT_TRANSFORM.json"
            receipt="$(dirname "${manifest}")/stage_receipt.json"
            python scripts/run_scientific_rewrite_private_smoke.py \
              --manifest "${manifest}" \
              --plaintext "${tmpdir}/source.md" \
              --output-age "${output_age}" \
              --result "${result}" \
              --receipt "${receipt}" \
              --workdir "${tmpdir}/work" \
              --model "${OPENAI_TEXT_TRANSFORM_MODEL:-gpt-5.6-terra}"
          done <<< "${AI_BRIDGE_TEXT_TRANSFORM_MANIFESTS}"

      - name: Commit text transform evidence
        if: env.AI_BRIDGE_TEXT_TRANSFORM_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            [ -n "${manifest}" ] || continue
            git add "$(dirname "${manifest}")/output.age" "$(dirname "${manifest}")/TEXT_TRANSFORM.json" "$(dirname "${manifest}")/stage_receipt.json"
          done <<< "${AI_BRIDGE_TEXT_TRANSFORM_MANIFESTS}"
          if git diff --cached --quiet; then
            echo "No text transform evidence changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI Bridge text transform evidence"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Text transform writeback requires a branch ref."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
