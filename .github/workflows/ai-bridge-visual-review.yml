name: AI Bridge Visual Review

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative visual input manifest path
        required: true
        default: results/001_task/visual_review/visual_inputs.json
      output:
        description: Repository-relative VISUAL_REVIEW.json output path
        required: true
        default: results/001_task/visual_review/VISUAL_REVIEW.json
  push:
    branches:
      - main
      - 'reviewed/**'
    paths:
      - 'results/**/visual_review/visual_inputs.json'

permissions:
  contents: write

jobs:
  visual-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_VISUAL_REVIEW_API_KEY }}
      OPENAI_VISUAL_REVIEW_MODEL: ${{ vars.OPENAI_VISUAL_REVIEW_MODEL }}
      AI_BRIDGE_VISUAL_REVIEW_MANIFEST: ${{ github.event.inputs.manifest }}
      AI_BRIDGE_VISUAL_REVIEW_OUTPUT: ${{ github.event.inputs.output }}
      AI_BRIDGE_KIT_PIP_SPEC: gpt-codex-ai-bridge-kit[visual-review] @ git+https://github.com/YuukiAS/GPT_Codex_AI_Bridge_Kit.git@9e8ab90fb13e92d268b08ad7fc7aa64ed9f9877a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bridge Kit visual review extra
        run: python -m pip install "${AI_BRIDGE_KIT_PIP_SPEC}"

      - name: Resolve visual review paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" ]; then
            mapfile -t manifests < <(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep '^results/.*/visual_review/visual_inputs[.]json$' || true)
            if [ "${#manifests[@]}" -eq 0 ]; then
              echo "No visual review manifest changed; not required."
              echo "AI_BRIDGE_VISUAL_REVIEW_SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "${#manifests[@]}" -gt 1 ]; then
              echo "Multiple visual review manifests changed; dispatch manually with one manifest."
              exit 1
            fi
            AI_BRIDGE_VISUAL_REVIEW_MANIFEST="${manifests[0]}"
          fi
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" ]; then
            AI_BRIDGE_VISUAL_REVIEW_OUTPUT="$(dirname "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}")/VISUAL_REVIEW.json"
          fi
          echo "AI_BRIDGE_VISUAL_REVIEW_MANIFEST=${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" >> "$GITHUB_ENV"
          echo "AI_BRIDGE_VISUAL_REVIEW_OUTPUT=${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" >> "$GITHUB_ENV"

      - name: Refuse missing visual review secret
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1'
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_VISUAL_REVIEW_API_KEY is not configured; skipping live visual review."
            echo "AI_BRIDGE_VISUAL_REVIEW_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Run visual review
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1'
        shell: bash
        run: |
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" ] || [ -z "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" ]; then
            echo "Visual review manifest/output path is not configured; skipping live visual review."
            echo "AI_BRIDGE_VISUAL_REVIEW_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          ai-bridge visual-review run \
            --target . \
            --manifest "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"

      - name: Commit visual review evidence
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1'
        shell: bash
        run: |
          set +e
          ai-bridge visual-review writeback-needed \
            --target . \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"
          writeback_status="$?"
          set -e
          if [ "${writeback_status}" -eq 0 ]; then
            echo "No visual review evidence changes."
            exit 0
          fi
          if [ "${writeback_status}" -ne 1 ]; then
            exit "${writeback_status}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI Bridge visual review evidence"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Visual review writeback requires a branch ref."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
