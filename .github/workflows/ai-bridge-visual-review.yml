name: AI Bridge Visual Review

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative visual input manifest path
        required: true
        default: results/001_task/visual_review/visual_inputs.json
      output:
        description: Repository-relative VISUAL_REVIEW.json output path
        required: true
        default: results/001_task/visual_review/VISUAL_REVIEW.json
  push:
    branches:
      - main
      - 'reviewed/**'
    paths-ignore:
      - 'results/**/visual_review/**'

permissions:
  contents: write

jobs:
  resolve_visual_review:
    name: Resolve Visual Review Target
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      status: ${{ steps.resolve.outputs.status }}
      task_key: ${{ steps.resolve.outputs.task_key }}
      manifest: ${{ steps.resolve.outputs.manifest }}
      output: ${{ steps.resolve.outputs.output }}
      implementation_commit: ${{ steps.resolve.outputs.implementation_commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: resolve
        name: Resolve visual review target
        shell: bash
        env:
          DISPATCH_MANIFEST: ${{ github.event.inputs.manifest }}
          DISPATCH_OUTPUT: ${{ github.event.inputs.output }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Using explicit workflow_dispatch visual review target."
            python -c 'import os, sys; sys.path.insert(0, "scripts"); import resolve_reviewed_handoff_visual_target as r; manifest = r.require_repo_relative_output_value(os.environ["DISPATCH_MANIFEST"], field="manifest"); output = r.require_repo_relative_output_value(os.environ["DISPATCH_OUTPUT"], field="output"); sha = os.environ["GITHUB_SHA"]; github_output = os.environ["GITHUB_OUTPUT"]; open(github_output, "a", encoding="utf-8").write("skip=0\nstatus=selected\ntask_key=workflow_dispatch\nmanifest=" + manifest + "\noutput=" + output + "\nimplementation_commit=" + sha + "\n")'
            exit 0
          fi
          python scripts/resolve_reviewed_handoff_visual_target.py --target . --github-output "$GITHUB_OUTPUT"

      - name: Summarize not-required visual review
        if: steps.resolve.outputs.skip == '1'
        shell: bash
        run: |
          echo "AI Bridge Visual Review: SKIPPED / NOT_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "No task-local visual review is pending; the expensive visual reviewer was not started." >> "$GITHUB_STEP_SUMMARY"

  run_visual_review:
    name: AI Bridge Visual Review
    runs-on: ubuntu-latest
    needs: resolve_visual_review
    if: github.event_name == 'workflow_dispatch' || needs.resolve_visual_review.outputs.skip != '1'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_VISUAL_REVIEW_API_KEY }}
      OPENAI_VISUAL_REVIEW_MODEL: ${{ vars.OPENAI_VISUAL_REVIEW_MODEL }}
      AI_BRIDGE_VISUAL_REVIEW_MANIFEST: ${{ needs.resolve_visual_review.outputs.manifest }}
      AI_BRIDGE_VISUAL_REVIEW_OUTPUT: ${{ needs.resolve_visual_review.outputs.output }}
      AI_BRIDGE_KIT_PIP_SPEC: gpt-codex-ai-bridge-kit[visual-review] @ git+https://github.com/YuukiAS/GPT_Codex_AI_Bridge_Kit.git@647f63c49ccea828a0ac76a6e9adce026531c906
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bridge Kit visual review extra
        run: python -m pip install "${AI_BRIDGE_KIT_PIP_SPEC}"

      - name: Refuse missing visual review secret
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_VISUAL_REVIEW_API_KEY is not configured; cannot run pending live visual review."
            exit 1
          fi

      - name: Run visual review
        shell: bash
        run: |
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" ] || [ -z "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" ]; then
            echo "Visual review manifest/output path is not configured for a selected visual review."
            exit 1
          fi
          ai-bridge visual-review run \
            --target . \
            --manifest "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"

      - name: Commit visual review evidence
        shell: bash
        run: |
          set +e
          ai-bridge visual-review writeback-needed \
            --target . \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"
          writeback_status="$?"
          set -e
          if [ "${writeback_status}" -eq 0 ]; then
            echo "No visual review evidence changes."
            exit 0
          fi
          if [ "${writeback_status}" -ne 1 ]; then
            exit "${writeback_status}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI Bridge visual review evidence"
          git push
