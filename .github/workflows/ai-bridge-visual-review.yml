name: AI Bridge Visual Review

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative visual input manifest path
        required: true
        default: results/001_task/visual_review/visual_inputs.json
      output:
        description: Repository-relative VISUAL_REVIEW.json output path
        required: true
        default: results/001_task/visual_review/VISUAL_REVIEW.json
      input_tokens_preflight_only:
        description: Verify /v1/responses/input_tokens permission only; do not call /v1/responses
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: ai-bridge-paid-review-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_VISUAL_REVIEW_API_KEY: ${{ secrets.OPENAI_VISUAL_REVIEW_API_KEY }}
      OPENAI_VISUAL_REVIEW_MODEL: gpt-5.6-terra
      AI_BRIDGE_VISUAL_REVIEW_MANIFEST: ${{ github.event.inputs.manifest }}
      AI_BRIDGE_VISUAL_REVIEW_OUTPUT: ${{ github.event.inputs.output }}
      AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY: ${{ github.event.inputs.input_tokens_preflight_only }}
      AI_BRIDGE_KIT_PIP_SPEC: gpt-codex-ai-bridge-kit[visual-review] @ git+https://github.com/YuukiAS/GPT_Codex_AI_Bridge_Kit.git@3d73572a6476f925745cfb873e48057c21be3502
      AI_BRIDGE_PAID_REVIEW_GIT_RESERVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bridge Kit visual review extra
        run: python -m pip install "${AI_BRIDGE_KIT_PIP_SPEC}"

      - name: Verify input-token endpoint permission only
        if: env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_VISUAL_REVIEW_API_KEY}" ]; then
            echo "OPENAI_VISUAL_REVIEW_API_KEY is not configured; cannot verify /v1/responses/input_tokens."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          payload = {
              "model": os.environ["OPENAI_VISUAL_REVIEW_MODEL"],
              "input": "Return exactly: ok",
              "max_output_tokens": 16,
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses/input_tokens",
              data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_VISUAL_REVIEW_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              try:
                  error = json.loads(raw).get("error", {})
              except Exception:
                  error = {"message": raw}
              print(f"input_tokens_permission: FAIL_CLOSED HTTP {exc.code}")
              print(f"openai_error_code: {error.get('code')}")
              print(f"openai_error_type: {error.get('type')}")
              print(f"openai_error_param: {error.get('param')}")
              print(f"openai_error_message: {error.get('message')}")
              sys.exit(1)
          tokens = result.get("input_tokens") or result.get("tokens") or result.get("total_tokens")
          print("input_tokens_permission: PASS")
          print("endpoint: /v1/responses/input_tokens")
          print(f"input_tokens: {tokens}")
          PY

      - name: Resolve visual review paths
        if: env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" ]; then
            echo "AI_BRIDGE_VISUAL_REVIEW_MANIFEST is required for explicit paid visual review."
            exit 1
          fi
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" ]; then
            AI_BRIDGE_VISUAL_REVIEW_OUTPUT="$(dirname "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}")/VISUAL_REVIEW.json"
          fi
          echo "AI_BRIDGE_VISUAL_REVIEW_MANIFEST=${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" >> "$GITHUB_ENV"
          echo "AI_BRIDGE_VISUAL_REVIEW_OUTPUT=${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" >> "$GITHUB_ENV"

      - name: Refuse missing visual review secret
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          if [ -z "${OPENAI_VISUAL_REVIEW_API_KEY}" ]; then
            echo "OPENAI_VISUAL_REVIEW_API_KEY is not configured; cannot run live visual review."
            exit 1
          fi

      - name: Run visual review
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          if [ -z "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" ] || [ -z "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}" ]; then
            echo "Visual review manifest/output path is not configured; cannot run live visual review."
            exit 1
          fi
          ai-bridge visual-review run \
            --target . \
            --manifest "${AI_BRIDGE_VISUAL_REVIEW_MANIFEST}" \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"

      - name: Commit visual review evidence
        if: env.AI_BRIDGE_VISUAL_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set +e
          ai-bridge visual-review writeback-needed \
            --target . \
            --output "${AI_BRIDGE_VISUAL_REVIEW_OUTPUT}"
          writeback_status="$?"
          set -e
          if [ "${writeback_status}" -eq 0 ]; then
            echo "No visual review evidence changes."
            exit 0
          fi
          if [ "${writeback_status}" -ne 1 ]; then
            exit "${writeback_status}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI Bridge visual review evidence"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Visual review writeback requires a branch ref."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
