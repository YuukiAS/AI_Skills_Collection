name: AI Bridge Text Review

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative text input manifest path
        required: true
        default: results/001_task/text_review/text_inputs.json
      output:
        description: Repository-relative TEXT_REVIEW.json output path
        required: true
        default: results/001_task/text_review/TEXT_REVIEW.json
      input_tokens_preflight_only:
        description: Verify /v1/responses/input_tokens permission only; do not call /v1/responses
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: ai-bridge-paid-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  text-review:
    runs-on: ubuntu-latest
    env:
      OPENAI_REVIEW_API_KEY: ${{ secrets.OPENAI_REVIEW_API_KEY }}
      OPENAI_TEXT_REVIEW_MODEL: gpt-5.6-terra
      AI_BRIDGE_TEXT_REVIEW_MANIFEST: ${{ github.event.inputs.manifest }}
      AI_BRIDGE_TEXT_REVIEW_OUTPUT: ${{ github.event.inputs.output }}
      AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY: ${{ github.event.inputs.input_tokens_preflight_only }}
      AI_BRIDGE_KIT_PIP_SPEC: gpt-codex-ai-bridge-kit[text-review] @ git+https://github.com/YuukiAS/GPT_Codex_AI_Bridge_Kit.git@6968a84b689d6e5589d068aee7dd101b12fd7700
      AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY: ${{ secrets.AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY }}
      AI_BRIDGE_PAID_REVIEW_GIT_RESERVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install age
        if: env.AI_BRIDGE_TEXT_REVIEW_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      - name: Install Bridge Kit text review extra
        run: python -m pip install "${AI_BRIDGE_KIT_PIP_SPEC}"

      - name: Verify input-token endpoint permission only
        if: env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_REVIEW_API_KEY}" ]; then
            echo "OPENAI_REVIEW_API_KEY is not configured; cannot verify /v1/responses/input_tokens."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          payload = {
              "model": os.environ["OPENAI_TEXT_REVIEW_MODEL"],
              "input": "Return exactly: ok",
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses/input_tokens",
              data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENAI_REVIEW_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              try:
                  error = json.loads(raw).get("error", {})
              except Exception:
                  error = {"message": raw}
              print(f"input_tokens_permission: FAIL_CLOSED HTTP {exc.code}")
              print(f"openai_error_code: {error.get('code')}")
              print(f"openai_error_type: {error.get('type')}")
              print(f"openai_error_param: {error.get('param')}")
              print(f"openai_error_message: {error.get('message')}")
              sys.exit(1)
          tokens = result.get("input_tokens") or result.get("tokens") or result.get("total_tokens")
          print("input_tokens_permission: PASS")
          print("endpoint: /v1/responses/input_tokens")
          print(f"input_tokens: {tokens}")
          PY

      - name: Resolve text review paths
        if: env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BRIDGE_TEXT_REVIEW_MANIFEST}" ]; then
            echo "AI_BRIDGE_TEXT_REVIEW_MANIFEST is required for explicit paid text review."
            exit 1
          fi
          if [ -z "${AI_BRIDGE_TEXT_REVIEW_OUTPUT}" ]; then
            AI_BRIDGE_TEXT_REVIEW_OUTPUT="$(dirname "${AI_BRIDGE_TEXT_REVIEW_MANIFEST}")/TEXT_REVIEW.json"
          fi
          echo "AI_BRIDGE_TEXT_REVIEW_MANIFEST=${AI_BRIDGE_TEXT_REVIEW_MANIFEST}" >> "$GITHUB_ENV"
          echo "AI_BRIDGE_TEXT_REVIEW_OUTPUT=${AI_BRIDGE_TEXT_REVIEW_OUTPUT}" >> "$GITHUB_ENV"

      - name: Refuse missing text review secrets
        if: env.AI_BRIDGE_TEXT_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY}" ]; then
            echo "AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY is not configured; cannot decrypt private text review payload."
            exit 1
          fi
          if [ -z "${OPENAI_REVIEW_API_KEY}" ]; then
            echo "OPENAI_REVIEW_API_KEY is not configured; cannot run live text review."
            exit 1
          fi

      - name: Decrypt private text payload
        if: env.AI_BRIDGE_TEXT_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          chmod 700 "${tmpdir}"
          umask 077
          printf '%s\n' "${AI_BRIDGE_PRIVATE_REVIEW_AGE_KEY}" > "${tmpdir}/identity.txt"
          ai-bridge text-review decrypt \
            --target . \
            --manifest "${AI_BRIDGE_TEXT_REVIEW_MANIFEST}" \
            --identity-file "${tmpdir}/identity.txt" \
            --output "${tmpdir}/plaintext.md"
          echo "AI_BRIDGE_TEXT_REVIEW_PLAINTEXT=${tmpdir}/plaintext.md" >> "$GITHUB_ENV"

      - name: Run text review
        if: env.AI_BRIDGE_TEXT_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ai-bridge text-review run \
            --target . \
            --manifest "${AI_BRIDGE_TEXT_REVIEW_MANIFEST}" \
            --plaintext "${AI_BRIDGE_TEXT_REVIEW_PLAINTEXT}" \
            --output "${AI_BRIDGE_TEXT_REVIEW_OUTPUT}"

      - name: Commit text review evidence
        if: env.AI_BRIDGE_TEXT_REVIEW_SKIP != '1' && env.AI_BRIDGE_INPUT_TOKENS_PREFLIGHT_ONLY != 'true'
        shell: bash
        run: |
          set +e
          ai-bridge text-review writeback-needed \
            --target . \
            --output "${AI_BRIDGE_TEXT_REVIEW_OUTPUT}"
          writeback_status="$?"
          set -e
          if [ "${writeback_status}" -eq 0 ]; then
            echo "No text review evidence changes."
            exit 0
          fi
          if [ "${writeback_status}" -ne 1 ]; then
            exit "${writeback_status}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI Bridge text review evidence"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Text review writeback requires a branch ref."
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
