schema: generic-deck-rules-v1
language: en
rules:
- id: LAY-GEOMETRY
  rule: Use a 160 by 90 mm slide with a 16:9 aspect ratio.
  mode: auto
  profile: v19
  thresholds:
    width: 160
    height: 90
    unit: mm
    aspect_ratio: '16:9'
    tolerance_pdf_pt: 0.5
    tolerance_origin: Engineering default for PDF export rounding; not a source-authored
      design margin.
  detector: check_geometry
  review: null
- id: LAY-RAILS
  rule: Keep both body rails at 8 mm, including the closing page.
  mode: partial
  profile: v19
  thresholds:
    left: 8
    right: 8
    unit: mm
  detector: screen_layout
  review: 正文左右各 8 mm；结束页沿用标准 rail，不得 full-bleed。
- id: ROLE-COVER-CONTENT
  rule: Limit the title page to the title, author and date.
  mode: partial
  profile: all
  thresholds:
    unit: null
    value: null
    specification: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_cover
  review: 标题页只放题目、作者和日期。
- id: TYPE-COVER-TITLE
  rule: Center the bold cover title using the V19 title role.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 24
    baseline_tex_pt: 27
    alignment: center
    weight: bold
    color_role: title_dark
  detector: screen_typography
  review: 题目居中；24 TeX pt / 27 pt baseline，bold，模板规定的标题深色。
- id: TYPE-COVER-BYLINE
  rule: Center author and date lines at 12.5/15 TeX pt.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 12.5
    baseline_tex_pt: 15
    alignment: center
  detector: screen_typography
  review: 作者、日期居中；12.5 TeX pt / 15 pt baseline。
- id: LAY-COVER-SPACING
  rule: Use shared V19 cover spacing without adding a subtitle.
  mode: partial
  profile: v19
  thresholds:
    unit: cm
    lead: 1.0
    byline: 0.52
    date: 0.18
    historical_subtitle: 0.18
  detector: screen_layout
  review: 标题页沿用共享lead、byline与date间距，历史subtitle间距不授权新增副标题。
- id: TYPE-FRAME-TITLE
  rule: Use the V19 frame_title role at 13/15.5 TeX pt with a 12.951 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 13
    baseline_tex_pt: 15.5
    font_pdf_pt: 12.951
    tolerance_pdf_pt: 0.1
    weight: bold
  detector: screen_typography
  review: frame title 13/15.5 TeX pt，bold；目标 12.951 PDF pt，容差 0.1。
- id: TYPE-BODY
  rule: Use the V19 body role at 11/13.5 TeX pt with a 10.959 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 11
    baseline_tex_pt: 13.5
    font_pdf_pt: 10.959
    tolerance_pdf_pt: 0.1
    weight: null
  detector: screen_typography
  review: body 11/13.5 TeX pt；10.959 PDF pt；同角色统一；禁止页内缩字、缩放文字。
- id: TYPE-SUBHEAD
  rule: Use the V19 subhead role at 11/13.5 TeX pt with a 10.959 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 11
    baseline_tex_pt: 13.5
    font_pdf_pt: 10.959
    tolerance_pdf_pt: 0.1
    weight: bold
  detector: screen_typography
  review: subhead 11/13.5 TeX pt，bold；10.959 PDF pt。
- id: TYPE-TABLE
  rule: Use the V19 table role at 10/12.2 TeX pt with a 9.963 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 10
    baseline_tex_pt: 12.2
    font_pdf_pt: 9.963
    tolerance_pdf_pt: 0.1
    weight: null
  detector: screen_typography
  review: table 10/12.2 TeX pt；9.963 PDF pt，容差 0.1。
- id: TYPE-CODE
  rule: Use the V19 code role at 8/9.6 TeX pt with a 7.97 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 8
    baseline_tex_pt: 9.6
    font_pdf_pt: 7.97
    tolerance_pdf_pt: 0.1
    weight: null
  detector: screen_typography
  review: code 8/9.6 TeX pt；7.970 PDF pt。
- id: TYPE-CAPTION
  rule: Use the V19 caption role at 8/9.6 TeX pt with a 7.97 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 8
    baseline_tex_pt: 9.6
    font_pdf_pt: 7.97
    tolerance_pdf_pt: 0.1
    weight: null
  detector: screen_typography
  review: caption 8/9.6 TeX pt；7.970 PDF pt；必须按图注角色使用。
- id: TYPE-FOOTER
  rule: Use the V19 footer role at 8/9.6 TeX pt with a 7.97 PDF pt size target.
  mode: partial
  profile: v19
  thresholds:
    font_tex_pt: 8
    baseline_tex_pt: 9.6
    font_pdf_pt: 7.97
    tolerance_pdf_pt: 0.1
    weight: null
  detector: screen_typography
  review: footer 8/9.6 TeX pt；7.970 PDF pt。
- id: TYPE-FONT-FAMILIES
  rule: Use the file-bound V19 font families for Latin, mathematics, CJK and code.
  mode: partial
  profile: v19
  thresholds:
    unit: font family
    latin: TeX Gyre Termes
    math: TeX Gyre Termes Math
    cal: New Computer Modern Math
    cjk:
    - Noto Serif SC
    - Noto Sans SC
    code: Latin Modern Mono
    file_bound: true
  detector: screen_typography
  review: Latin=TeX Gyre Termes；math=TeX Gyre Termes Math；cal=New Computer Modern
    Math；CJK=Noto Serif/Sans SC；code=Latin Modern Mono；固定字体文件。
- id: TYPE-DECK-CONSISTENCY
  rule: Keep every typography role consistent across the deck and forbid page-local
    shrinking or text scaling.
  mode: partial
  profile: all
  thresholds:
    allowed_page_local_overrides: 0
    unit: occurrence
  detector: screen_typography
  review: 同一字号角色全套统一，禁止逐页缩字或缩放含文字对象。
- id: TYPE-NORMAL-LEADING
  rule: Keep normal body leading at 13.5 TeX pt without local compression.
  mode: partial
  profile: v19
  thresholds:
    body_baseline_tex_pt: 13.5
    pdf_conversion: TeX pt * 72 / 72.27
    source_override_allowed: false
  detector: screen_typography
  review: 正文正常 baseline=13.5 TeX pt；禁止局部 reduced baselineskip。
- id: TYPE-LIST-PARAMETERS
  rule: Use one shared list parameter set throughout the V19 deck.
  mode: partial
  profile: v19
  thresholds:
    unit: TeX pt
    itemsep: 1.15
    topsep: 2
    parsep: 0
    parskip: 0
    body_baseline: 13.5
  detector: screen_tex
  review: V19全套列表共享itemsep=1.15、topsep=2、parsep=parskip=0 TeX pt，保持body baseline=13.5
    TeX pt。
- id: TYPE-LIST-STYLE
  rule: Use one left-aligned list style per group with normal wrapped-line leading
    and body-sized levels.
  mode: partial
  profile: all
  thresholds:
    alignment: left
    body_role_for_all_levels: true
    mixed_peer_list_styles_allowed: false
  detector: screen_typography
  review: 换行 item 正常行距；各层正文沿用 body 字号；同组同一种列表形式。
- id: LAY-SPACE-LIST-ITEM-GAP
  rule: Measure list_item_gap from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 3
    - 7
    fail_below: 2
    review_above: 9
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: list_item_gap：可见对象间距目标 3–7 PDF pt；低于 2 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-PARAGRAPH-TO-LIST
  rule: Measure paragraph_to_list from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 5
    - 12
    fail_below: 3
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: paragraph_to_list：可见对象间距目标 5–12 PDF pt；低于 3 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-PARAGRAPH-TO-TABLE
  rule: Measure paragraph_to_table from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 7
    - 14
    fail_below: 4
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: paragraph_to_table：可见对象间距目标 7–14 PDF pt；低于 4 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-PARAGRAPH-TO-FIGURE
  rule: Measure paragraph_to_figure from visible semantic-object edges using the frozen
