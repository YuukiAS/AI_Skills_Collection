  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 7
    - 14
    fail_below: 4
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: paragraph_to_figure：可见对象间距目标 7–14 PDF pt；低于 4 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-PARAGRAPH-TO-DISPLAY-MATH
  rule: Measure paragraph_to_display_math from visible semantic-object edges using
    the frozen projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 5
    - 12
    fail_below: 3
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: paragraph_to_display_math：可见对象间距目标 5–12 PDF pt；低于 3 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-DISPLAY-MATH-TO-TABLE
  rule: Measure display_math_to_table from visible semantic-object edges using the
    frozen projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 7
    - 14
    fail_below: 4
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: display_math_to_table：可见对象间距目标 7–14 PDF pt；低于 4 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-DISPLAY-MATH-TO-BODY
  rule: Measure display_math_to_body from visible semantic-object edges using the
    frozen projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 5
    - 12
    fail_below: 3
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: display_math_to_body：可见对象间距目标 5–12 PDF pt；低于 3 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-TABLE-TO-INTERPRETATION
  rule: Measure table_to_interpretation from visible semantic-object edges using the
    frozen projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 7
    - 17
    fail_below: 5
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: table_to_interpretation：可见对象间距目标 7–17 PDF pt；低于 5 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-CAPTION-TO-BODY
  rule: Measure caption_to_body from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 6
    - 12
    fail_below: 4
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: caption_to_body：可见对象间距目标 6–12 PDF pt；低于 4 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-QUESTION-TO-NEXT
  rule: Measure question_to_next from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 8
    - 15
    fail_below: 6
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: question_to_next：可见对象间距目标 8–15 PDF pt；低于 6 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-WITHIN-GROUP
  rule: Measure within_group from visible semantic-object edges using the frozen projection
    spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 5
    - 15
    fail_below: 4
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: within_group：可见对象间距目标 5–15 PDF pt；低于 4 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-BETWEEN-GROUP
  rule: Measure between_group from visible semantic-object edges using the frozen
    projection spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    target:
    - 9
    - 22
    fail_below: 7
    outside_target: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_spacing
  review: between_group：可见对象间距目标 9–22 PDF pt；低于 7 FAIL；从实际墨迹/对象边缘测量。
- id: LAY-SPACE-MAJOR-SECTION
  rule: Use the frozen major_section visible-edge spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    A_compact:
    - 13
    - 22
    B_projection:
    - 15
    - 27
    fail_below: 13
  detector: screen_spacing
  review: major_section按可见对象边缘测量，B_projection目标为15–27 PDF pt，低于13 PDF pt失败。
- id: LAY-SPACE-TITLE-TO-QUESTION
  rule: Use the frozen title_to_question visible-edge spacing band.
  mode: partial
  profile: v19
  thresholds:
    unit: PDF pt
    A_compact:
    - 8
    - 20
    B_projection:
    - 10
    - 23
    fail_below: 8
  detector: screen_spacing
  review: title_to_question按可见对象边缘测量，B_projection目标为10–23 PDF pt，低于8 PDF pt失败。
- id: LAY-SPACING-ROLES
  rule: Declare a spacing role for every adjacent semantic-block pair and measure
    visible edges instead of raw glue.
  mode: partial
  profile: v19
  thresholds:
    unmapped_adjacent_pairs_allowed: 0
    raw_vspace_substitution_allowed: false
    unit: pair
  detector: screen_layout
  review: 每对相邻语义块声明 spacing role；从可见边缘测量；禁止用 raw vspace 假造间距。
- id: LAY-CONTINUATION-ANCHOR
  rule: Align continuation text to the bullet text anchor rather than the bullet glyph.
  mode: partial
  profile: all
  thresholds:
    anchor_error_max: 2
    unit: px@1920x1080
  detector: screen_layout
  review: 同组段落、list continuation 以 bullet 正文而非圆点为左锚，误差 ≤2px（1920×1080）。
- id: LAY-TABLE-ATOMS
  rule: Keep semantic atoms unbroken and make peer-header wrapping deliberate and
    consistent.
  mode: partial
  profile: all
  thresholds:
    unit: line break
    unintended_atom_splits_allowed: 0
    unintentional_short_tail_lines_allowed: 0
  detector: screen_layout
  review: 表格单元格保留模型名、变量、公式、单位语义原子；短尾词不单独成行；同级表头换行有意且一致。
- id: LAY-COLUMN-REASON
  rule: Use columns for justified parallel comparison and keep sequential reasoning
    vertical.
  mode: partial
  profile: all
  thresholds:
    parallel_comparison_default: true
    heterogeneous_layout_requires_reading_order_and_approval: true
  detector: screen_layout
  review: 平行比较才默认并栏；顺序推理沿纵向排；异质同排必须说明读法并获准页型。
- id: LAY-COLUMN-PRESETS
  rule: Use approved column-width presets and a 3–4 percent gutter.
  mode: partial
  profile: v19
  thresholds:
    unit: fraction of body width
    presets:
    - - 0.48
      - 0.48
    - - 0.57
      - 0.39
    - - 0.39
      - 0.57
    gutter:
    - 0.03
    - 0.04
  detector: screen_layout
  review: 全局栏宽预设 .48/.48、.57/.39、.39/.57，gutter 3–4%。
- id: LAY-COLUMN-ANCHORS
  rule: Honor the declared top or baseline anchor within 2 pixels and prevent horizontal
    overlap.
  mode: partial
  profile: v19
  thresholds:
    anchor_error_max: 2
    unit: px@1920x1080
    horizontal_overlap_allowed: false
  detector: screen_layout
  review: 并栏声明同顶/同基线锚点，误差 ≤2px；不得横向重叠。
- id: LAY-COLUMN-BOTTOMS
  rule: Review peer-column bottom differences above 100 pixels and inspect unused
    space in each column.
  mode: partial
  profile: all
  thresholds:
    review_above: 100
    unit: px@1920x1080
  detector: screen_layout
  review: peer 下缘差 >100px 需复核；孤栏下方大空白不得仅按总占用率通过。
- id: ROLE-FULL-WIDTH-TRANSITION
  rule: Give post-column full-width text an approved transition role and a 9–22 PDF
    pt visible gap.
  mode: partial
  profile: v19
  thresholds:
    gap:
    - 9
    - 22
    unit: PDF pt
    macros:
    - shared takeaway
    - shared note
    - shared conclusion
  detector: screen_layout
  review: 并栏结束后的全宽结语用 共享结论组件/共享说明组件/共享结论组件 角色宏；间距 B 9–22 PDF pt。
- id: PROC-DENSITY-REPAIR
  rule: Recompose with fixed roles before asking the content owner to split or delete
    content.
  mode: judged
  profile: all
  thresholds:
    unit: null
    value: null
    specification: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: null
  review: 固定字号/间距下先重排，再由内容负责人决定拆页/删减；不逐页缩字。
- id: TYPE-NO-COMPRESSION
  rule: Forbid negative body spacing, body nointerlineskip, arraystretch below one
    and local tabcolsep below 3 TeX pt.
  mode: partial
  profile: v19
  thresholds:
    negative_body_vspace_allowed: false
    body_nointerlineskip_allowed: false
    arraystretch_min: 1
    tabcolsep_min_tex_pt: 3
  detector: screen_tex
  review: 禁止负 vspace、nointerlineskip 用于正文压缩、arraystretch<1、局部 tabcolsep<3pt。
- id: LAY-BODY-WHITESPACE
  rule: Require ordinary-page content span of at least 60 percent and each outer blank
    band at most 25 percent of the body track.
  mode: partial
  profile: all
  thresholds:
    unit: fraction of body-track height
    span_min: 0.6
    top_blank_max: 0.25
    bottom_blank_max: 0.25
    v19_track_pdf_pt:
    - 46
    - 245
    v19_track_height_pdf_pt: 199
    v19_span_min_pdf_pt: 119.4
    v19_blank_max_pdf_pt: 49.75
    exclude_page_types:
    - title
    - dedicated_closing
    objects: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_layout
  review: 普通页实际语义对象纵向跨度至少占正文轨道60%，上下连续空白各不超过25%。
- id: CAP-NATURAL-SENTENCE
  rule: Write one natural sentence explaining what the figure or table shows or compares.
  mode: partial
  profile: all
  thresholds:
    unit: null
    value: null
    specification: Confirm against the declared template; no unspecified hard threshold
      is inferred.
  detector: screen_captions
  review: caption用一句自然话说明图表展示什么、比较什么。
- id: CAP-BELOW-OBJECT
  rule: Place each figure or table caption directly below its own object.
  mode: partial
  profile: all
  thresholds:
    relative_position: below own object
    unit: object pair
  detector: screen_captions
  review: 所有图注和表注均放所属对象正下方。
- id: CAP-LINE-AWARE-ALIGNMENT
  rule: Center a single rendered caption line and left-align multiple lines to the
    actual object width.
  mode: partial
  profile: all
  thresholds:
    line_count: actual rendered lines
    single_line: center
    multiple_lines: left
    anchor_error_max: 2
    unit: px@1920x1080
  detector: screen_captions
  review: 以对象实际宽度排版后计行，单行caption居中、多行caption左对齐。
- id: CAP-MULTILINE-ANCHOR
  rule: Keep all multiline caption lines ragged-right at the object left anchor without
    guessing line count from characters.
  mode: partial
  profile: all
  thresholds:
    anchor_error_max: 2
    unit: px@1920x1080
    character_count_proxy_allowed: false
  detector: screen_captions
  review: 多行caption每行共用对象左锚并右侧不齐，不能按字符数猜行数。
- id: LAY-DIAGRAM-SHAFT
  rule: Require each semantic shaft to be at least 6 mm, review lengths below 8 mm
    and prefer 8–10 mm for process edges.
  mode: partial
  profile: v19
  thresholds:
    unit: mm
    fail_below: 6
    review_interval:
    - 6
    - 8
    review_upper_exclusive: true
    pass_min: 8
    preferred:
    - 8
    - 10
    pass_requires_other_geometry: true
  detector: screen_layout
  review: 每条语义连接线可见箭杆 <6mm FAIL；6≤L<8mm REVIEW；L≥8mm 且几何合格 PASS；流程优选8–10mm。
- id: LAY-DIAGRAM-BOUNDARIES
  rule: Connect edges at node boundaries within 2 pixels without text collisions or
    unintended clipping.
  mode: partial
  profile: v19
  thresholds:
    unit: px@1920x1080
    boundary_error_max: 2
    collisions_allowed: false
    unintended_clipping_allowed: false
  detector: screen_layout
  review: 端点接在节点边界；boundary tolerance ≤2px；不可穿字、碰撞、无意裁切。
- id: LAY-DIAGRAM-PEER-EDGES
  rule: Keep peer edges evenly spaced and equal in visible length within 2 pixels.
  mode: partial
  profile: v19
  thresholds:
    unit: px@1920x1080
    peer_length_error_max: 2
    equal_peer_gaps_required: true
  detector: screen_layout
  review: 同类平行边等距/等长，peer length tolerance ≤2px。
- id: LAY-DIAGRAM-SHARED-STYLES
  rule: Use the shared V19 node and edge styles without resizing diagram text.
  mode: partial
  profile: v19
  thresholds:
    unit: TeX pt
    node_stroke: 0.55
    rounded_corners: 2
    inner_xsep: 6
