[permissions.slurm-protected-cancel-global]
extends = ":workspace"

[permissions.slurm-protected-cancel-global.filesystem]
"/users/a/e/aereinh/.codex/slurm-protected-cancel" = "deny"
"/usr/bin/scancel" = "deny"
