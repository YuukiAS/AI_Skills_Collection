hooks.PostToolUse = [{ matcher = "^request_user_input$", hooks = [{ type = "command", command = "/usr/bin/bash -c 'set -eu; target=$1; expected=$2; actual=$(/usr/bin/sha256sum -- \"$target\"); actual=${actual%% *}; [ \"$actual\" = \"$expected\" ] || exit 78; exec /usr/bin/python3 \"$target\"' slurm-protected-cancel /users/a/e/aereinh/.codex/slurm-protected-cancel/slurm-hook-1e9e42cff1f0af369f58dd4bb3045ae62b786b530eade34ee89cd704c5b595a4.py 1e9e42cff1f0af369f58dd4bb3045ae62b786b530eade34ee89cd704c5b595a4", timeout = 15, statusMessage = "Verifying protected Slurm cancellation" }] }]
